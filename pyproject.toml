[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llamar-integration"
version = "0.1.0"
description = "MARoS × LLaMAR SAR 集成层 — 多智能体搜救任务协调与实验框架"
requires-python = ">=3.10"
authors = [
    { name = "WYH" },
]

dependencies = [
    "a2a-sdk>=1.0.0",           # Google A2A protocol SDK
    "fastapi>=0.115.0",          # Web framework
    "uvicorn[standard]>=0.30.0",  # ASGI server
    "httpx>=0.27.0",             # Async HTTP client
    "websockets>=12.0",          # WebSocket support
    "pydantic>=2.0.0",           # Data validation
    "pyyaml>=6.0",               # YAML parsing
    "anthropic>=0.40.0",         # Anthropic API client
    "tiktoken>=0.5.0",           # Token counting
    "openai>=1.57.4",            # OpenAI API client (also DeepSeek etc.)
    "typer>=0.9.0",              # CLI framework
    "sse-starlette>=3.4.2",      # SSE support
    "mcp>=1.28.0",               # MCP Python SDK for Map Agent MCP server
    "langgraph>=0.2.0",          # LangGraph for agent orchestration
    "langchain-openai>=0.2.0",   # ChatOpenAI client for Map Agent LLM queries
    "numpy>=2.2.6",
    "opencv-python>=4.13.0.92",
]

# ══════════════════════════════════════════════════════════════════════════
# 可选依赖分组 — 按模块职责划分，用户按需安装
# ══════════════════════════════════════════════════════════════════════════

[project.optional-dependencies]
# ── SAR 引擎（LLaMAR SAR/ 目录下的 grid-world 环境） ──
sar = [
    "numpy>=1.23.0",
    "opencv-python>=4.9.0",
    "matplotlib>=3.8.0",
]

# ── 协调器 HTTP 服务（A2A FastAPI + WebSocket 端点） ──
coordinator = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sse-starlette>=3.4.2",
    "websockets>=12.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "typer>=0.9.0",
]

# ── LLM 客户端（Agent / Coordinator 推理） ──
llm = [
    "anthropic>=0.40.0",
    "openai>=1.57.0",
    "tiktoken>=0.5.0",
    "mini-agent",
]

# ── 记忆服务（MARoS memory_server，需要 sentence-transformers + sqlite-vec） ──
memory = [
    "sentence-transformers>=2.2.0",
    "sqlite-vec>=0.1.0",
    "pysqlite3-binary>=0.5.0",
]

# ── 开发与测试 ──
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

# ── 全部（等同于 sar + coordinator + llm + memory + dev） ──
all = [
    "llamar-integration[sar,coordinator,llm,memory,dev]",
]

# ══════════════════════════════════════════════════════════════════════════
# MARoS 本地包说明
#
# openharness-a2a 和 a2a_lib 属于 MARoS 项目（/home/wyh/daily_work/MARoS/），
# 通过 `uv pip install -e <path> --no-deps` 安装到当前 venv：
#
#   uv pip install -e /home/wyh/daily_work/MARoS/maros_ws/a2a_lib --no-deps
#   uv pip install -e /home/wyh/daily_work/MARoS/my_a2a --no-deps
#
# 它们不在此文件中声明，以免与 MARoS 的版本冲突。
# ══════════════════════════════════════════════════════════════════════════

[tool.uv.sources]
mini-agent = { git = "https://github.com/wyh2255/Mini-Agent.git", rev = "feature/task-context" }

[tool.uv.workspace]
members = []

[project.scripts]
a2a = "a2a.coordinator.cli:app"
a2a-worker = "a2a.worker.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/a2a", "sar_orch"]

[tool.pytest.ini_options]
testpaths = ["sar_orch"]
asyncio_mode = "auto"
markers = [
    "unit: 单元测试（无需网络 / LLM）",
]
