<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAR 实时仪表盘</title>
<style>
/* ===== Reset & Variables ===== */
:root {
  --bg: #0f172a; --surface: #1e293b; --surface2: #334155;
  --text: #e2e8f0; --text-muted: #94a3b8; --accent: #3b82f6;
  --success: #22c55e; --warn: #f59e0b; --danger: #ef4444;
  --border: #334155; --radius: 8px;
  --font: 'SF Mono', 'Consolas', 'Fira Code', monospace;
  --font-ui: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: var(--font-ui); background: var(--bg); color: var(--text);
  height: 100vh; overflow: hidden; display: flex; flex-direction: column;
}

/* ===== Header ===== */
#header {
  display: flex; align-items: center; gap: 16px;
  padding: 10px 20px; background: var(--surface);
  border-bottom: 1px solid var(--border); flex-shrink: 0;
}
#header h1 { font-size: 15px; font-weight: 600; color: var(--accent); }
#header .step-badge {
  font-size: 12px; padding: 2px 10px; border-radius: 12px;
  background: var(--surface2); color: var(--text-muted);
}
#header .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.dot-live { background: var(--success); animation: pulse 1s infinite; }
.dot-done { background: var(--accent); }
.dot-wait { background: var(--warn); }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }

#nav { display: flex; gap: 4px; margin-left: auto; }
#nav a {
  color: var(--text-muted); text-decoration: none; font-size: 12px;
  padding: 4px 12px; border-radius: 6px; background: var(--surface2);
  border: 1px solid var(--border); transition: all .2s;
}
#nav a:hover { background: var(--surface); color: var(--text); }
#nav a.active { background: var(--accent); color: #fff; border-color: var(--accent); }

/* ===== Layout ===== */
#main { flex: 1; display: flex; overflow: hidden; }
#map-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
#sidebar {
  width: 340px; flex-shrink: 0; background: var(--surface);
  border-left: 1px solid var(--border); overflow-y: auto;
  display: flex; flex-direction: column;
}

/* ===== Tab Bar ===== */
.tab-bar {
  display: flex; gap: 2px; padding: 8px 16px 0; flex-shrink: 0;
  background: var(--bg);
}
.tab-btn {
  padding: 6px 16px; font-size: 12px; font-weight: 500;
  border: 1px solid var(--border); border-bottom: none;
  border-radius: 6px 6px 0 0; background: var(--surface2);
  color: var(--text-muted); cursor: pointer; transition: all .2s;
}
.tab-btn:hover { background: var(--surface); color: var(--text); }
.tab-btn.active { background: var(--surface); color: var(--accent); border-color: var(--accent); }

/* ===== Map Container ===== */
.map-container {
  flex: 1; overflow: auto; padding: 12px; position: relative;
  display: flex; justify-content: center; align-items: flex-start;
}
.map-view { display: none; }
.map-view.active { display: block; }

/* ===== Grid Table ===== */
#grid { border-collapse: collapse; }
#grid td {
  width: 26px; height: 26px; border: 1px solid var(--border);
  text-align: center; font-size: 8px; cursor: default;
  transition: background 0.2s;
}
#grid td:hover { outline: 2px solid var(--accent); outline-offset: -2px; z-index: 1; }
#grid th {
  background: var(--surface2); font-size: 9px; color: var(--text-muted);
  min-width: 26px; font-weight: 400;
}
#grid td.sm-marker { position: relative; }
#grid td.sm-marker::after {
  content: ''; position: absolute; top: 0; right: 0;
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--accent); border: 1px solid var(--bg);
}

/* ===== Trajectory Overlay ===== */
#trajectory-overlay {
  position: absolute; top: 0; left: 0; pointer-events: none;
  z-index: 10;
}

/* ===== Sidebar Sections ===== */
.sidebar-section {
  padding: 12px 16px; border-bottom: 1px solid var(--border);
}
.sidebar-section h3 {
  font-size: 11px; font-weight: 600; text-transform: uppercase;
  color: var(--text-muted); margin-bottom: 8px; letter-spacing: .5px;
}
.metric-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.metric-card {
  background: var(--surface2); border-radius: 6px; padding: 8px 10px;
}
.metric-card .label { font-size: 10px; color: var(--text-muted); }
.metric-card .value { font-size: 18px; font-weight: 700; color: var(--text); font-family: var(--font); }
.metric-card .value.good { color: var(--success); }
.metric-card .value.warn { color: var(--warn); }
.metric-card .value.bad { color: var(--danger); }
.metric-card .sub { font-size: 10px; color: var(--text-muted); }

/* ===== Agent Cards ===== */
.agent-card {
  background: var(--surface2); border-radius: 6px; padding: 8px 10px;
  margin-bottom: 4px; border-left: 3px solid var(--accent);
}
.agent-card .name { font-weight: 600; font-size: 12px; }
.agent-card .detail { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
.agent-card .pos { font-family: var(--font); font-size: 10px; }
.inv-badge {
  display: inline-block; padding: 1px 5px; border-radius: 3px;
  font-size: 10px; background: var(--surface); color: var(--text-muted);
  margin: 1px;
}

/* ===== Observation Feed ===== */
#obs-feed {
  flex: 1; overflow-y: auto; max-height: 200px;
  font-size: 11px; line-height: 1.5;
}
.obs-entry {
  padding: 3px 0; border-bottom: 1px solid var(--border);
  animation: fadeIn .3s ease;
}
@keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
.obs-entry .agent-tag {
  display: inline-block; font-size: 9px; padding: 1px 5px;
  border-radius: 3px; font-weight: 600; margin-right: 4px;
}
.obs-entry .step-tag { color: var(--text-muted); font-size: 9px; margin-left: 4px; }

/* ===== Token Bar ===== */
.token-bar {
  display: flex; align-items: center; gap: 8px; margin: 4px 0;
}
.token-bar .label { font-size: 10px; color: var(--text-muted); min-width: 60px; }
.token-bar .bar-track {
  flex: 1; height: 6px; background: var(--surface2); border-radius: 3px; overflow: hidden;
}
.token-bar .bar-fill {
  height: 100%; border-radius: 3px; transition: width .5s ease;
}
.token-bar .bar-val { font-size: 10px; font-family: var(--font); min-width: 50px; text-align: right; color: var(--text-muted); }

/* ===== Timeline ===== */
#timeline-bar {
  flex-shrink: 0; padding: 8px 16px; background: var(--surface);
  border-top: 1px solid var(--border); display: flex;
  align-items: center; gap: 12px;
}
#timeline-bar input[type="range"] {
  flex: 1; height: 4px; -webkit-appearance: none; appearance: none;
  background: var(--surface2); border-radius: 2px; outline: none;
}
#timeline-bar input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 14px; height: 14px;
  border-radius: 50%; background: var(--accent); cursor: pointer;
  border: 2px solid var(--surface);
}
#timeline-bar .tl-label { font-size: 11px; color: var(--text-muted); min-width: 80px; }
.tl-btn {
  padding: 4px 10px; font-size: 11px; border-radius: 4px;
  border: 1px solid var(--border); background: var(--surface2);
  color: var(--text); cursor: pointer;
}
.tl-btn:hover { background: var(--accent); color: #fff; }
.tl-btn.active { background: var(--accent); color: #fff; }

/* ===== Step Log ===== */
#step-log {
  max-height: 150px; overflow-y: auto; font-size: 10px;
  font-family: var(--font);
}
.step-log-entry { padding: 2px 0; color: var(--text-muted); }
.step-log-entry .agent { color: var(--accent); }
.step-log-entry .action { color: var(--text); }
.step-log-entry .error { color: var(--danger); }

/* ===== Scrollbar ===== */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--surface); }
::-webkit-scrollbar-thumb { background: var(--surface2); border-radius: 3px; }

/* ===== Comparison toggle ===== */
.comparison-info {
  font-size: 11px; color: var(--text-muted); padding: 6px 12px;
  background: var(--surface); border-bottom: 1px solid var(--border);
}
.comparison-info .known { color: var(--accent); }
.comparison-info .unknown { color: var(--warn); }

/* ===== Semantic Map legend extras ===== */
.sm-legend-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin-right: 4px; }

/* ===== Empty states ===== */
.empty-state { padding: 40px 20px; text-align: center; color: var(--text-muted); font-size: 13px; }

/* ===== Error list ===== */
.error-list { font-size: 10px; }
.error-item { color: var(--danger); padding: 1px 0; }
</style>
</head>
<body>

<!-- ===== Header ===== -->
<div id="header">
  <h1>&#x1F9E0; SAR 实时仪表盘</h1>
  <span class="step-badge"><span id="status-dot" class="status-dot dot-wait"></span> <span id="step-label">等待连接...</span></span>
  <div id="nav">
    <a href="/ui">Tasks</a>
    <a href="/ui/map">Map</a>
    <a href="/dashboard" class="active">Dashboard</a>
  </div>
</div>

<!-- ===== Main ===== -->
<div id="main">
  <!-- Map Area -->
  <div id="map-area">
    <div class="tab-bar">
      <button class="tab-btn active" data-tab="ground-truth">&#x1F30D; 物理真相</button>
      <button class="tab-btn" data-tab="semantic">&#x1F50D; 观测地图</button>
      <button class="tab-btn" data-tab="trajectory">&#x1F4CD; 轨迹</button>
      <button class="tab-btn" data-tab="timeline">&#x1F4C8; 时间轴</button>
    </div>

    <!-- Ground Truth -->
    <div class="map-container">
      <div id="view-ground-truth" class="map-view active">
        <div style="position:relative;display:inline-block;">
          <table id="grid"></table>
          <svg id="trajectory-overlay" style="position:absolute;top:0;left:0;pointer-events:none;"></svg>
        </div>
      </div>

      <!-- Semantic Map -->
      <div id="view-semantic" class="map-view">
        <div class="comparison-info">
          <span class="known">&#x25CF; 已观测</span> — 蓝色标记表示 agent 已报告的动态对象位置
        </div>
        <div style="position:relative;display:inline-block;">
          <table id="grid-sm"></table>
        </div>
      </div>

      <!-- Trajectory -->
      <div id="view-trajectory" class="map-view">
        <div class="comparison-info">Agent 历史轨迹 — 路径颜色按 agent 区分</div>
        <div style="position:relative;display:inline-block;">
          <table id="grid-traj"></table>
          <svg id="trajectory-svg" style="position:absolute;top:0;left:0;pointer-events:none;"></svg>
        </div>
      </div>

      <!-- Timeline Replay -->
      <div id="view-timeline" class="map-view">
        <div style="position:relative;display:inline-block;">
          <table id="grid-tl"></table>
          <svg id="tl-overlay" style="position:absolute;top:0;left:0;pointer-events:none;"></svg>
        </div>
      </div>
    </div>
  </div>

  <!-- Sidebar -->
  <div id="sidebar">
    <div class="sidebar-section">
      <h3>&#x1F4CA; 指标</h3>
      <div class="metric-grid">
        <div class="metric-card">
          <div class="label">Step</div>
          <div class="value" id="m-step">0</div>
        </div>
        <div class="metric-card">
          <div class="label">完成</div>
          <div class="value" id="m-finished">—</div>
        </div>
        <div class="metric-card">
          <div class="label">覆盖率</div>
          <div class="value" id="m-coverage">0%</div>
          <div class="sub" id="m-coverage-bar" style="height:3px;background:var(--surface2);border-radius:2px;margin-top:2px;"><div style="height:100%;width:0%;background:var(--accent);border-radius:2px;transition:width .5s;"></div></div>
        </div>
        <div class="metric-card">
          <div class="label">运输率</div>
          <div class="value" id="m-transport">0%</div>
          <div class="sub" id="m-transport-bar" style="height:3px;background:var(--surface2);border-radius:2px;margin-top:2px;"><div style="height:100%;width:0%;background:var(--success);border-radius:2px;transition:width .5s;"></div></div>
        </div>
      </div>
    </div>

    <div class="sidebar-section">
      <h3>&#x1F916; Agents</h3>
      <div id="agent-cards"></div>
    </div>

    <div class="sidebar-section" style="flex:1;display:flex;flex-direction:column;overflow:hidden;">
      <h3>&#x1F4AC; 观测流</h3>
      <div id="obs-feed"><div class="empty-state">等待 agent 观测数据...</div></div>
    </div>

    <div class="sidebar-section">
      <h3>&#x26A1; Token 用量</h3>
      <div id="token-panel">
        <div class="token-bar"><span class="label">Prompt</span><div class="bar-track"><div class="bar-fill" style="width:0%;background:var(--accent);" id="tok-prompt-bar"></div></div><span class="bar-val" id="tok-prompt-val">0</span></div>
        <div class="token-bar"><span class="label">Completion</span><div class="bar-track"><div class="bar-fill" style="width:0%;background:var(--success);" id="tok-comp-bar"></div></div><span class="bar-val" id="tok-comp-val">0</span></div>
        <div class="token-bar"><span class="label">累计</span><div class="bar-track"><div class="bar-fill" style="width:0%;background:var(--warn);" id="tok-cum-bar"></div></div><span class="bar-val" id="tok-cum-val">0</span></div>
      </div>
    </div>

    <div class="sidebar-section" style="border-bottom:none;">
      <h3>&#x1F4DD; Step Log</h3>
      <div id="step-log"></div>
    </div>
  </div>
</div>

<!-- ===== Timeline ===== -->
<div id="timeline-bar">
  <span class="tl-label" id="tl-label">Step <span id="tl-current">0</span> / <span id="tl-max">0</span></span>
  <input type="range" id="tl-slider" min="0" max="0" value="0" disabled>
  <button class="tl-btn" id="tl-play-btn">&#x25B6; 回放</button>
  <button class="tl-btn" id="tl-reset-btn">&#x21BA; 实时</button>
  <span style="font-size:10px;color:var(--text-muted);margin-left:auto;" id="tl-speed-label">1x</span>
</div>

<script>
// ============================================================
// Constants & State
// ============================================================
const CELL_SIZE = 28; // 26px content + 2px border
const HEADER_W = 28;  // header column width
const HEADER_H = 28;  // header row height
const FIRE_COLORS = {
  'NONE': '#1e293b', 'LOW': '#f5f0e1', 'MEDIUM': '#f5a623', 'HIGH': '#ef4444'
};
const AGENT_COLORS = ['#ec4899', '#8b5cf6', '#06b6d4', '#f97316', '#84cc16', '#14b8a6'];
const AGENT_NAMES = ['Alice','Bob','Charlie','David','Emma','Finn'];
const AGENT_LABELS = ['A','B','C','D','E','F'];

let allData = null;
let currentStep = -1;
let isLive = true;
let tlPlaying = false;
let tlTimer = null;
let trajectoryCache = {
  steps: [],  // [{step, agentPositions: {agentId: {x,y}}}]
  agentPaths: {},  // {agentId: [{step, x, y}]}
};

// Tab switching
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const tab = btn.dataset.tab;
    document.querySelectorAll('.map-view').forEach(v => v.classList.remove('active'));
    const view = document.getElementById('view-' + tab);
    if (view) view.classList.add('active');
    // Re-render current data in new tab
    if (allData) renderAll(allData);
  });
});

// ============================================================
// Color helpers
// ============================================================
function getCellColor(obj) {
  const t = obj.type;
  if (t === 'AbsAgent') {
    const idx = (obj.agent_id !== undefined) ? obj.agent_id : (AGENT_NAMES.indexOf(obj.name) % AGENT_COLORS.length);
    return AGENT_COLORS[idx >= 0 ? idx : 0];
  }
  if (t === 'Flammable') {
    const intensity = (obj.intensity || '').toUpperCase();
    return FIRE_COLORS[intensity] || '#1e293b';
  }
  if (t === 'Fire') return (obj.fire_type || '').includes('A') ? '#8b4513' : '#fa8072';
  if (t === 'Reservoir') return (obj.resource_type || '').includes('A') ? '#5f9ea0' : '#00ffff';
  if (t === 'Deposit') return '#475569';
  if (t === 'Person') {
    const status = (obj.status || '').toUpperCase();
    return (status === 'GRABBED' || status === 'CARRIED') ? '#c026d3' : '#a855f7';
  }
  return '#1e293b';
}

function getCellLabel(obj) {
  const t = obj.type;
  if (t === 'AbsAgent') {
    const idx = (obj.agent_id !== undefined) ? obj.agent_id : (AGENT_NAMES.indexOf(obj.name) % AGENT_LABELS.length);
    return AGENT_LABELS[idx >= 0 ? idx : 0];
  }
  if (t === 'Flammable') {
    const i = (obj.intensity || 'N').charAt(0);
    return i === 'N' ? '' : i;
  }
  if (t === 'Fire') return 'F';
  if (t === 'Reservoir') return 'R';
  if (t === 'Deposit') return 'D';
  if (t === 'Person') return 'P';
  return '';
}

function getCellTitle(obj) {
  const parts = [obj.type];
  if (obj.name) parts.push(obj.name);
  if (obj.intensity) parts.push('i=' + obj.intensity);
  if (obj.average_intensity) parts.push('avg=' + obj.average_intensity);
  if (obj.fire_type) parts.push('type=' + obj.fire_type);
  if (obj.resource_type) parts.push('res=' + obj.resource_type);
  if (obj.status) parts.push('s=' + obj.status);
  if (obj.inventory) parts.push('inv=' + JSON.stringify(obj.inventory));
  return parts.join(' | ');
}

// ============================================================
// Grid rendering
// ============================================================
function buildGrid(snapshot, tableId, showTrajectory, currentStepFilter, showSemanticMarkers, semanticData) {
  const allObjects = [];
  let maxX = 2, maxY = 2;

  for (const cat of ['agents', 'fires', 'persons', 'reservoirs', 'deposits', 'flammables']) {
    for (const obj of (snapshot[cat] || [])) {
      const pos = obj.position;
      if (pos && Array.isArray(pos) && pos.length >= 2) {
        obj._gx = pos[0];
        obj._gy = pos[1];
        maxX = Math.max(maxX, pos[0] + 1);
        maxY = Math.max(maxY, pos[1] + 1);
      }
      allObjects.push(obj);
    }
  }

  // Build {x,y} -> [objects]
  const grid = {};
  for (const obj of allObjects) {
    if (obj._gx === undefined) continue;
    const key = obj._gx + ',' + obj._gy;
    if (!grid[key]) grid[key] = [];
    grid[key].push(obj);
  }

  // Semantic markers: {x,y} -> true
  const semPositions = {};
  if (showSemanticMarkers && semanticData && semanticData.known_dynamic_objects) {
    for (const cat of ['fires', 'persons']) {
      for (const obj of (semanticData.known_dynamic_objects[cat] || [])) {
        const pos = obj.position;
        if (pos && Array.isArray(pos) && pos.length >= 2) {
          semPositions[pos[0] + ',' + pos[1]] = true;
        }
      }
    }
  }

  const table = document.getElementById(tableId);
  if (!table) return;
  table.innerHTML = '';

  // Header
  let html = '<tr><th>y\\x</th>';
  for (let x = 0; x < maxX; x++) html += `<th>${x}</th>`;
  html += '</tr>';

  for (let y = 0; y < maxY; y++) {
    html += `<tr><th>${y}</th>`;
    for (let x = 0; x < maxX; x++) {
      const key = x + ',' + y;
      const objects = grid[key] || [];
      if (objects.length === 0) {
        let cls = '';
        if (semPositions[key]) cls = ' class="sm-marker"';
        html += `<td${cls} style="background:#1e293b;"></td>`;
      } else {
        const top = objects[objects.length - 1];
        const color = getCellColor(top);
        const label = getCellLabel(top);
        const title = objects.map(getCellTitle).join('\n');
        const cnt = objects.length > 1 ? `<sup>${objects.length}</sup>` : '';
        let cls = '';
        if (currentStepFilter >= 0 && top.type === 'AbsAgent') {
          // Dim agent if not at current step position
        }
        if (semPositions[key] && top.type !== 'AbsAgent') cls = ' class="sm-marker"';
        html += `<td${cls} style="background:${color};" title="${title.replace(/"/g,'&quot;')}">${label}${cnt}</td>`;
      }
    }
    html += '</tr>';
  }
  table.innerHTML = html;
  return { maxX, maxY };
}

// ============================================================
// Trajectory overlay rendering
// ============================================================
function renderTrajectorySVG(svgId, trajectoryData, maxX, maxY, stepFilter) {
  const svg = document.getElementById(svgId);
  if (!svg || !trajectoryData || trajectoryData.length === 0) return;

  const cs = CELL_SIZE, hw = HEADER_W, hh = HEADER_H;
  const width = (maxX + 1) * cs;
  const height = (maxY + 1) * cs + hh;
  svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
  svg.style.width = width + 'px';
  svg.style.height = height + 'px';

  // Build agent paths
  const agentPaths = {};
  for (const entry of trajectoryData) {
    for (const agent of (entry.agents || [])) {
      const pos = agent.position;
      if (!pos || pos.length < 2) continue;
      const aid = agent.agent_id !== undefined ? agent.agent_id : 0;
      if (!agentPaths[aid]) agentPaths[aid] = [];
      agentPaths[aid].push({ step: entry.step, x: pos[0], y: pos[1] });
    }
  }

  let svgContent = '';
  for (const [aid, path] of Object.entries(agentPaths)) {
    if (path.length < 2) continue;
    const color = AGENT_COLORS[parseInt(aid) % AGENT_COLORS.length];
    // Filter to up to current step
    let pts = path;
    if (stepFilter >= 0) {
      pts = path.filter(p => p.step <= stepFilter);
    }
    if (pts.length < 2) continue;

    // Draw polyline — center of each cell = hw + (x+0.5)*cs, hh + (y+0.5)*cs
    const points = pts.map(p => {
      const cx = hw + (p.x + 0.5) * cs;
      const cy = hh + (p.y + 0.5) * cs;
      return `${cx},${cy}`;
    }).join(' ');

    svgContent += `<polyline points="${points}"
      fill="none" stroke="${color}" stroke-width="2.5"
      stroke-linejoin="round" stroke-linecap="round" opacity="0.7" />`;

    // Draw dots at each position (larger at current position)
    for (let pi = 0; pi < pts.length; pi++) {
      const p = pts[pi];
      const cx = hw + (p.x + 0.5) * cs;
      const cy = hh + (p.y + 0.5) * cs;
      const isLast = pi === pts.length - 1 && (stepFilter < 0 || p.step <= stepFilter);
      const isFirst = pi === 0;
      const r = isLast ? 5 : (isFirst ? 3 : 2);
      const op = isLast ? 1 : 0.4;
      svgContent += `<circle cx="${cx}" cy="${cy}" r="${r}"
        fill="${color}" opacity="${op}" />`;
    }
  }
  svg.innerHTML = svgContent;
}

// ============================================================
// Sidebar rendering
// ============================================================
function renderSidebar(data) {
  const env = data.env_snapshot || {};
  const m = data;

  // Metrics
  document.getElementById('m-step').textContent = m.step;
  document.getElementById('m-finished').textContent = m.finished ? '✓' : '…';
  const covEl = document.getElementById('m-coverage');
  const covPct = (m.coverage * 100).toFixed(1);
  covEl.textContent = covPct + '%';
  const covBar = document.querySelector('#m-coverage-bar div');
  if (covBar) covBar.style.width = covPct + '%';

  const trpEl = document.getElementById('m-transport');
  const trpPct = (m.transport_rate * 100).toFixed(1);
  trpEl.textContent = trpPct + '%';
  const trpBar = document.querySelector('#m-transport-bar div');
  if (trpBar) trpBar.style.width = trpPct + '%';

  // Status dot
  const dot = document.getElementById('status-dot');
  const label = document.getElementById('step-label');
  if (m.finished) {
    dot.className = 'status-dot dot-done';
    label.textContent = '✓ Finished — Step ' + m.step;
  } else {
    dot.className = 'status-dot dot-live';
    label.textContent = '● Live — Step ' + m.step;
  }

  // Agent cards
  let agentHtml = '';
  for (const a of (env.agents || [])) {
    const idx = (a.agent_id !== undefined) ? a.agent_id : (AGENT_NAMES.indexOf(a.name) % AGENT_COLORS.length);
    const color = AGENT_COLORS[idx >= 0 ? idx : 0];
    const inv = a.inventory || {};
    const invItems = Object.entries(inv).filter(([,v]) => v > 0).map(([k,v]) => `<span class="inv-badge">${k}:${v}</span>`).join('');
    const pos = a.position ? `(${a.position[0]},${a.position[1]})` : '?';
    agentHtml += `<div class="agent-card" style="border-left-color:${color};">
      <div class="name">${a.name || '?'}</div>
      <div class="detail"><span class="pos">${pos}</span></div>
      <div class="detail">${invItems || 'empty'}</div>
    </div>`;
  }
  document.getElementById('agent-cards').innerHTML = agentHtml || '<div class="empty-state">No agents</div>';

  // Token panel
  const tok = data.router_tokens || {};
  const maxCum = Math.max(tok.cumulative_total || 1, 1);
  document.getElementById('tok-prompt-bar').style.width = Math.min((tok.prompt_tokens / Math.max(maxCum, 1)) * 100, 100) + '%';
  document.getElementById('tok-prompt-val').textContent = (tok.cumulative_prompt || 0).toLocaleString();
  document.getElementById('tok-comp-bar').style.width = Math.min((tok.completion_tokens / Math.max(maxCum, 1)) * 100, 100) + '%';
  document.getElementById('tok-comp-val').textContent = (tok.cumulative_completion || 0).toLocaleString();
  document.getElementById('tok-cum-bar').style.width = Math.min((tok.cumulative_total / Math.max(maxCum * 2, 1)) * 100, 100) + '%';
  document.getElementById('tok-cum-val').textContent = (tok.cumulative_total || 0).toLocaleString();

  // Step log
  const log = data.last_step_log || {};
  let logHtml = '';
  const actions = log.actions || [];
  const errors = log.error_types || [];
  const timeoutAgents = log.timeout_agents || [];
  for (let i = 0; i < actions.length; i++) {
    const agentName = AGENT_NAMES[i] || 'Agent' + i;
    const action = actions[i] || '—';
    const hasError = errors[i];
    const isTimeout = timeoutAgents.includes(i);
    let actionStr = action;
    if (isTimeout) actionStr = '⏱ ' + action;
    logHtml += `<div class="step-log-entry">
      <span class="agent">${agentName}</span> <span class="action">${actionStr}</span>
      ${hasError ? `<span class="error">&#x26A0;</span>` : ''}
    </div>`;
  }
  document.getElementById('step-log').innerHTML = logHtml || '<div class="step-log-entry" style="color:var(--text-muted);">No step data yet</div>';

  // Observation feed
  const obsStream = data.observation_stream || [];
  if (obsStream.length > 0) {
    const feed = document.getElementById('obs-feed');
    // Only add new entries (from last step)
    const lastStepObs = obsStream.filter(o => o.step === m.step);
    for (const obs of lastStepObs) {
      const agentIdx = AGENT_NAMES.indexOf(obs.agent) % AGENT_COLORS.length;
      const color = AGENT_COLORS[agentIdx >= 0 ? agentIdx : 0];
      const text = obs.text ? obs.text.substring(0, 120) : '';
      const entry = document.createElement('div');
      entry.className = 'obs-entry';
      entry.innerHTML = `<span class="agent-tag" style="background:${color}22;color:${color}">${obs.agent || '?'}</span>
        <span>${text}</span>
        <span class="step-tag">step ${obs.step}</span>`;
      feed.prepend(entry);
      // Keep max 50 entries
      while (feed.children.length > 50) feed.removeChild(feed.lastChild);
    }
  }
}

// ============================================================
// Semantic map rendering (overlay on GT grid)
// ============================================================
function renderSemanticMap(data) {
  const sm = data.semantic_map || {};
  const env = data.env_snapshot || {};

  // Build a semantic-only view: priors (static) + observed dynamic objects + agent positions
  const semGrid = {
    agents: env.agents || [],            // agent positions from env (ground truth for positioning)
    fires: [], persons: [],
    reservoirs: [], deposits: [], flammables: [],
  };

  // Priors: known static objects from initialization
  const priors = sm.known_priors || {};
  semGrid.reservoirs = (priors.reservoirs || []).map(r => ({
    type: 'Reservoir',
    name: r.name || 'R',
    position: r.position,
    resource_type: (r.attributes && r.attributes.resource_type) || 'Water',
  }));
  semGrid.deposits = (priors.deposits || []).map(d => ({
    type: 'Deposit',
    name: d.name || 'D',
    position: d.position,
  }));

  // Observed dynamic objects from semantic map
  const dynamic = sm.known_dynamic_objects || {};
  semGrid.fires = (dynamic.fires || []).map(f => ({
    type: 'Flammable',
    name: f.name || 'Fire',
    position: f.position,
    intensity: (f.attributes && f.attributes.intensity) || 'LOW',
    _observed: true,
  }));
  semGrid.persons = (dynamic.persons || []).map(p => ({
    type: 'Person',
    name: p.name || 'Person',
    position: p.position,
    status: (p.attributes && p.attributes.status) || 'WAITING',
    _observed: true,
  }));

  // Also add flammable cells from env as background (dimmed) to show context
  for (const fl of (env.flammables || [])) {
    const pos = fl.position;
    if (!pos || pos.length < 2) continue;
    const key = pos[0] + ',' + pos[1];
    // Check if this position already has a semantic observation
    const hasObs = semGrid.fires.some(f => {
      const fp = f.position;
      return fp && fp[0] === pos[0] && fp[1] === pos[1];
    });
    if (!hasObs) {
      semGrid.flammables.push({ ...fl, _unobserved: true });
    }
  }

  // Render with semantic markers for observed objects
  buildGridCustom(semGrid, 'grid-sm');
}

// Custom buildGrid that handles _observed and _unobserved flags
function buildGridCustom(snapshot, tableId) {
  const allObjects = [];
  let maxX = 2, maxY = 2;

  for (const cat of ['agents', 'fires', 'persons', 'reservoirs', 'deposits', 'flammables']) {
    for (const obj of (snapshot[cat] || [])) {
      const pos = obj.position;
      if (pos && Array.isArray(pos) && pos.length >= 2) {
        obj._gx = pos[0];
        obj._gy = pos[1];
        maxX = Math.max(maxX, pos[0] + 1);
        maxY = Math.max(maxY, pos[1] + 1);
      }
      allObjects.push(obj);
    }
  }

  const grid = {};
  for (const obj of allObjects) {
    if (obj._gx === undefined) continue;
    const key = obj._gx + ',' + obj._gy;
    if (!grid[key]) grid[key] = [];
    grid[key].push(obj);
  }

  // Determine observed positions
  const observedPositions = {};
  for (const obj of allObjects) {
    if (obj._observed) {
      const key = obj._gx + ',' + obj._gy;
      observedPositions[key] = true;
    }
  }

  const table = document.getElementById(tableId);
  if (!table) return;
  table.innerHTML = '';

  let html = '<tr><th>y\\x</th>';
  for (let x = 0; x < maxX; x++) html += `<th>${x}</th>`;
  html += '</tr>';

  for (let y = 0; y < maxY; y++) {
    html += `<tr><th>${y}</th>`;
    for (let x = 0; x < maxX; x++) {
      const key = x + ',' + y;
      const objects = grid[key] || [];
      if (objects.length === 0) {
        // Unexplored cell — dark background
        html += `<td style="background:#0f172a;"></td>`;
        continue;
      }
      // Priority: agent > observed dynamic > priors > dimmed flammable > empty
      const agent = objects.find(o => o.type === 'AbsAgent');
      const observed = objects.find(o => o._observed);
      const prior = objects.find(o => o.type === 'Reservoir' || o.type === 'Deposit');
      const dimmed = objects.find(o => o._unobserved);

      let top;
      if (agent) top = agent;
      else if (observed) top = observed;
      else if (prior) top = prior;
      else top = objects[objects.length - 1];

      const color = getCellColor(top);
      const label = getCellLabel(top);
      const title = objects.map(getCellTitle).join('\n');
      const cnt = objects.length > 1 ? `<sup>${objects.length}</sup>` : '';

      // Add observed marker ring for observed objects
      let extraStyle = '';
      if (observed) {
        extraStyle = ';outline:2px solid #3b82f6;outline-offset:-3px;';
      } else if (dimmed) {
        extraStyle = ';opacity:0.3;';
      }
      const obsIcon = observed && !agent ? '&#x25C9;' : '';

      html += `<td style="background:${color}${extraStyle}" title="${title.replace(/"/g,'&quot;')}">${obsIcon}${label}${cnt}</td>`;
    }
    html += '</tr>';
  }
  table.innerHTML = html;
  return { maxX, maxY };
}

// ============================================================
// Timeline rendering
// ============================================================
function renderTimeline(data) {
  const traj = data.trajectory_history || [];
  const max = traj.length > 0 ? traj[traj.length - 1].step : 0;
  const slider = document.getElementById('tl-slider');
  slider.max = max;
  slider.disabled = false;
  document.getElementById('tl-max').textContent = max;

  // Get current slider value
  const tlStep = parseInt(slider.value);
  document.getElementById('tl-current').textContent = tlStep;

  // Find the snapshot at that step (use latest available)
  const env = data.env_snapshot || {};
  buildGrid(env, 'grid-tl', false, tlStep, false, null);

  // Draw trajectories filtered to this step
  const { maxX, maxY } = getGridDims(env);
  renderTrajectorySVG('tl-overlay', traj, maxX, maxY, tlStep);
}

function getGridDims(snapshot) {
  let maxX = 2, maxY = 2;
  for (const cat of ['agents', 'fires', 'persons', 'reservoirs', 'deposits', 'flammables']) {
    for (const obj of (snapshot[cat] || [])) {
      const pos = obj.position;
      if (pos && pos.length >= 2) {
        maxX = Math.max(maxX, pos[0] + 1);
        maxY = Math.max(maxY, pos[1] + 1);
      }
    }
  }
  return { maxX, maxY };
}

// ============================================================
// Main render
// ============================================================
function renderAll(data) {
  allData = data;
  currentStep = data.step;

  // Determine active tab
  const activeTab = document.querySelector('.tab-btn.active');
  const tab = activeTab ? activeTab.dataset.tab : 'ground-truth';

  switch (tab) {
    case 'ground-truth': {
      const env = data.env_snapshot || {};
      const dims = buildGrid(env, 'grid', false, -1, false, null);
      const traj = data.trajectory_history || [];
      if (dims) renderTrajectorySVG('trajectory-overlay', traj, dims.maxX, dims.maxY, -1);
      break;
    }
    case 'semantic':
      renderSemanticMap(data);
      break;
    case 'trajectory': {
      const env = data.env_snapshot || {};
      const dims = buildGrid(env, 'grid-traj', true, -1, false, null);
      const traj = data.trajectory_history || [];
      if (dims) renderTrajectorySVG('trajectory-svg', traj, dims.maxX, dims.maxY, -1);
      break;
    }
    case 'timeline':
      renderTimeline(data);
      break;
  }

  renderSidebar(data);

  // Update timeline slider max
  const traj = data.trajectory_history || [];
  const maxStep = traj.length > 0 ? traj[traj.length - 1].step : 0;
  const slider = document.getElementById('tl-slider');
  if (maxStep > slider.max) {
    slider.max = maxStep;
    if (isLive) slider.value = maxStep;
  }
  document.getElementById('tl-max').textContent = slider.max;
  if (isLive) {
    document.getElementById('tl-current').textContent = slider.value;
  }
}

// ============================================================
// Timeline slider & replay
// ============================================================
document.getElementById('tl-slider').addEventListener('input', function() {
  isLive = false;
  if (tlPlaying) {
    clearInterval(tlTimer);
    tlPlaying = false;
    document.getElementById('tl-play-btn').textContent = '\u25B6 回放';
  }
  document.getElementById('tl-current').textContent = this.value;
  // Re-render timeline tab with this step
  if (allData) renderTimeline(allData);
});

document.getElementById('tl-reset-btn').addEventListener('click', function() {
  isLive = true;
  if (tlPlaying) {
    clearInterval(tlTimer);
    tlPlaying = false;
    document.getElementById('tl-play-btn').textContent = '\u25B6 回放';
  }
  const slider = document.getElementById('tl-slider');
  if (allData && allData.trajectory_history) {
    const last = allData.trajectory_history.length;
    slider.value = last > 0 ? allData.trajectory_history[last-1].step : 0;
  }
  document.getElementById('tl-current').textContent = slider.value;
});

document.getElementById('tl-play-btn').addEventListener('click', function() {
  if (tlPlaying) {
    clearInterval(tlTimer);
    tlPlaying = false;
    this.textContent = '\u25B6 回放';
    return;
  }
  const slider = document.getElementById('tl-slider');
  if (parseInt(slider.max) === 0) return;
  isLive = false;
  tlPlaying = true;
  this.textContent = '\u23F8 暂停';
  slider.value = 0;
  tlTimer = setInterval(() => {
    let val = parseInt(slider.value);
    const max = parseInt(slider.max);
    if (val >= max) {
      clearInterval(tlTimer);
      tlPlaying = false;
      document.getElementById('tl-play-btn').textContent = '\u25B6 回放';
      return;
    }
    slider.value = val + 1;
    document.getElementById('tl-current').textContent = slider.value;
    if (allData) renderTimeline(allData);
  }, 800);
});

// ============================================================
// SSE Connection
// ============================================================
function connectSSE() {
  const evtSource = new EventSource('/dashboard/stream');

  evtSource.addEventListener('waiting', () => {
    document.getElementById('status-dot').className = 'status-dot dot-wait';
    document.getElementById('step-label').textContent = '⏳ 等待开始...';
  });

  evtSource.onmessage = function(event) {
    try {
      const data = JSON.parse(event.data);
      renderAll(data);
    } catch (e) {
      console.error('Parse error:', e);
    }
  };

  evtSource.onerror = function() {
    document.getElementById('status-dot').className = 'status-dot dot-wait';
    document.getElementById('step-label').textContent = '⚠ 连接断开';
  };

  return evtSource;
}

// Start
let sse = connectSSE();
