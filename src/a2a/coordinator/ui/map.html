<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAR Map — Real-time Grid</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { 
    font-family: 'SF Mono', 'Consolas', monospace; 
    background: #ffffff; color: #1a2332;
    display: flex; height: 100vh;
  }
  #main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  #header {
    padding: 12px 20px; background: #f4f6f9; border-bottom: 1px solid #e0e4e8;
    display: flex; justify-content: space-between; align-items: center;
  }
  #header h1 { font-size: 16px; color: #2563eb; }
  #status { font-size: 13px; color: #5a6a7e; }
  #status .live { color: #16a34a; font-weight: bold; }
  #status .done { color: #2563eb; }
  #grid-container { flex: 1; overflow: auto; padding: 20px; display: flex; justify-content: center; align-items: flex-start; }
  #grid { border-collapse: collapse; }
  #grid td {
    width: 28px; height: 28px; border: 1px solid #e8ecf0;
    text-align: center; font-size: 9px; cursor: default;
    transition: background 0.3s;
  }
  #grid td:hover { outline: 2px solid #2563eb; outline-offset: -2px; z-index: 1; }
  #sidebar {
    width: 340px; background: #f4f6f9; border-left: 1px solid #e0e4e8;
    overflow-y: auto; padding: 16px; font-size: 13px;
  }
  #sidebar h2 { font-size: 14px; color: #2563eb; margin-bottom: 8px; border-bottom: 1px solid #e0e4e8; padding-bottom: 4px; }
  .section { margin-bottom: 16px; }
  .metric { display: flex; justify-content: space-between; padding: 2px 0; }
  .metric .val { font-weight: bold; }
  .agent-card, .fire-card, .person-card {
    background: #ffffff; border-radius: 6px; padding: 8px 10px; margin-bottom: 6px;
    border-left: 3px solid #2563eb;
  }
  .agent-card { border-left-color: #ec4899; }
  .fire-card { border-left-color: #f97316; }
  .person-card { border-left-color: #a855f7; }
  .card-header { font-weight: bold; margin-bottom: 2px; }
  .card-detail { color: #5a6a7e; font-size: 12px; }
  .inventory { display: inline-flex; gap: 4px; }
  .inv-item {
    display: inline-block; padding: 1px 6px; border-radius: 3px;
    font-size: 11px; background: #e8ecf0;
  }
  .legend { margin-top: 16px; }
  .legend-item { display: flex; align-items: center; gap: 6px; margin: 3px 0; font-size: 12px; }
  .legend-swatch { width: 14px; height: 14px; border-radius: 2px; border: 1px solid #ccc; }
  #nav { display: flex; gap: 8px; }
  #nav a {
    color: #2563eb; text-decoration: none; font-size: 12px;
    padding: 4px 10px; border-radius: 4px; background: #ffffff; border: 1px solid #d0d5dd;
  }
  #nav a:hover { background: #e8ecf0; }
</style>
</head>
<body>
<div id="main">
  <div id="header">
    <h1>🗺 SAR Grid Map</h1>
    <div id="nav">
      <a href="/ui">Tasks</a>
      <a href="/ui/debug">Debug</a>
      <a href="/ui/map" style="background:#2563eb;color:#fff;">Map</a>
    </div>
    <div id="status"><span id="step-label">Waiting for data...</span></div>
  </div>
  <div id="grid-container">
    <table id="grid"></table>
  </div>
</div>
<div id="sidebar">
  <div id="metrics" class="section"></div>
  <div id="agents" class="section"></div>
  <div id="fires" class="section"></div>
  <div id="persons" class="section"></div>
  <div class="legend">
    <h2>Legend</h2>
    <div class="legend-item"><span class="legend-swatch" style="background:#ffffff"></span> Empty</div>
    <div class="legend-item"><span class="legend-swatch" style="background:#f5f0e1"></span> Fire LOW</div>
    <div class="legend-item"><span class="legend-swatch" style="background:#f5a623"></span> Fire MEDIUM</div>
    <div class="legend-item"><span class="legend-swatch" style="background:#e74c3c"></span> Fire HIGH</div>
    <div class="legend-item"><span class="legend-swatch" style="background:#ec4899"></span> Agent</div>
    <div class="legend-item"><span class="legend-swatch" style="background:#5f9ea0"></span> Reservoir (Sand)</div>
    <div class="legend-item"><span class="legend-swatch" style="background:#00ffff"></span> Reservoir (Water)</div>
    <div class="legend-item"><span class="legend-swatch" style="background:#333333"></span> Deposit</div>
    <div class="legend-item"><span class="legend-swatch" style="background:#a855f7"></span> Person</div>
    <div class="legend-item"><span class="legend-swatch" style="background:#c026d3"></span> Person (Carried)</div>
  </div>
</div>

<script>
const FIRE_COLORS = {
  'NONE': '#ffffff',
  'LOW': '#f5f0e1',
  'MEDIUM': '#f5a623',
  'HIGH': '#e74c3c',
};

function getCellColor(obj) {
  const t = obj.type;
  if (t === 'AbsAgent') return '#ec4899';
  if (t === 'Flammable') {
    const intensity = (obj.intensity || '').toUpperCase();
    return FIRE_COLORS[intensity] || '#f5f0e1';
  }
  if (t === 'Fire') {
    return (obj.fire_type || '').includes('A') ? '#8b4513' : '#fa8072';
  }
  if (t === 'Reservoir') {
    return (obj.resource_type || '').includes('A') ? '#5f9ea0' : '#00ffff';
  }
  if (t === 'Deposit') return '#333333';
  if (t === 'Person') {
    const status = (obj.status || '').toUpperCase();
    return status === 'GRABBED' || status === 'CARRIED' ? '#c026d3' : '#a855f7';
  }
  return '#ffffff';
}

function getCellLabel(obj) {
  const t = obj.type;
  if (t === 'AbsAgent') return (obj.name || 'A').charAt(0);
  if (t === 'Flammable') {
    const i = (obj.intensity || 'N').charAt(0);
    return i === 'N' ? '' : i;
  }
  if (t === 'Fire') return 'F';
  if (t === 'Reservoir') return 'R';
  if (t === 'Deposit') return 'D';
  if (t === 'Person') return 'P';
  return '';
}

function getCellTitle(obj) {
  const parts = [obj.type];
  if (obj.name) parts.push(obj.name);
  if (obj.intensity) parts.push('intensity=' + obj.intensity);
  if (obj.fire_type) parts.push('type=' + obj.fire_type);
  if (obj.resource_type) parts.push('resource=' + obj.resource_type);
  if (obj.status) parts.push('status=' + obj.status);
  if (obj.average_intensity) parts.push('avg=' + obj.average_intensity);
  return parts.join(' | ');
}

function renderGrid(snapshot) {
  const allObjects = [];
  let maxX = 2, maxY = 2;

  for (const cat of ['agents', 'fires', 'persons', 'reservoirs', 'deposits', 'flammables']) {
    for (const obj of (snapshot[cat] || [])) {
      const pos = obj.position;
      if (pos && Array.isArray(pos) && pos.length >= 2) {
        const gx = pos[0], gy = pos[1];
        obj._gx = pos[0];
        obj._gy = pos[1];
        maxX = Math.max(maxX, pos[0] + 1);
        maxY = Math.max(maxY, pos[1] + 1);
      }
      allObjects.push(obj);
    }
  }

  // Build grid map: (x, y) -> [objects]
  const grid = {};
  for (const obj of allObjects) {
    if (obj._gx === undefined) continue;
    const key = obj._gx + ',' + obj._gy;
    if (!grid[key]) grid[key] = [];
    grid[key].push(obj);
  }

  const table = document.getElementById('grid');
  table.innerHTML = '';

  // Column header (x)
  let headerRow = '<tr><th style="background:#f4f6f9;font-size:10px;color:#5a6a7e;">y\\x</th>';
  for (let x = 0; x < maxX; x++) {
    headerRow += `<th style="background:#f4f6f9;font-size:10px;color:#5a6a7e;min-width:28px;">${x}</th>`;
  }
  headerRow += '</tr>';
  table.innerHTML += headerRow;

  for (let y = 0; y < maxY; y++) {
    let row = `<tr><td style="background:#f4f6f9;font-size:10px;color:#5a6a7e;text-align:right;padding-right:4px;">${y}</td>`;
    for (let x = 0; x < maxX; x++) {
      const key = x + ',' + y;
      const objects = grid[key] || [];
      if (objects.length === 0) {
        row += '<td style="background:#ffffff;"></td>';
      } else {
        // Top object determines display; show count if multiple
        const top = objects[objects.length - 1];
        const color = getCellColor(top);
        const label = getCellLabel(top);
        const title = objects.map(getCellTitle).join('\n');
        const cnt = objects.length > 1 ? `<sup>${objects.length}</sup>` : '';
        row += `<td style="background:${color};" title="${title.replace(/"/g,'&quot;')}">${label}${cnt}</td>`;
      }
    }
    row += '</tr>';
    table.innerHTML += row;
  }
}

function renderSidebar(data) {
  const s = data.snapshot;
  const m = data;

  document.getElementById('step-label').innerHTML =
    m.finished
      ? '<span class="done">✓ Finished</span> — Step ' + m.step
      : '<span class="live">● Live</span> — Step ' + m.step;

  document.getElementById('metrics').innerHTML = `<h2>Metrics</h2>
    <div class="metric"><span>Step</span><span class="val">${m.step}</span></div>
    <div class="metric"><span>Coverage</span><span class="val">${(m.coverage*100).toFixed(1)}%</span></div>
    <div class="metric"><span>Transport</span><span class="val">${(m.transport_rate*100).toFixed(1)}%</span></div>
    <div class="metric"><span>Finished</span><span class="val">${m.finished ? '✓' : '—'}</span></div>`;

  let agentHtml = '<h2>Agents</h2>';
  for (const a of (s.agents || [])) {
    const inv = a.inventory || {};
    const invItems = Object.entries(inv).filter(([,v]) => v > 0).map(([k,v]) => `<span class="inv-item">${k}:${v}</span>`).join('');
    const pos = a.position ? `(${a.position[0]},${a.position[1]})` : '?';
    agentHtml += `<div class="agent-card">
      <div class="card-header">🤖 ${a.name || '?'}</div>
      <div class="card-detail">pos: ${pos}</div>
      <div class="card-detail">inv: ${invItems || 'empty'}</div>
    </div>`;
  }
  document.getElementById('agents').innerHTML = agentHtml;

  let fireHtml = '<h2>Fires</h2>';
  for (const f of (s.fires || [])) {
    const pos = f.position ? `(${f.position[0]},${f.position[1]})` : '?';
    fireHtml += `<div class="fire-card">
      <div class="card-header">🔥 ${f.name || '?'}</div>
      <div class="card-detail">intensity: ${f.average_intensity || '?'} | type: ${f.fire_type || '?'}</div>
      <div class="card-detail">pos: ${pos}</div>
    </div>`;
  }
  for (const fl of (s.flammables || [])) {
    const pos = fl.position ? `(${fl.position[0]},${fl.position[1]})` : '?';
    if ((fl.intensity || '').toUpperCase() === 'NONE') continue;
    fireHtml += `<div class="fire-card" style="border-left-color:#fbbf24;">
      <div class="card-header">🟡 ${fl.name || fl.object_id || '?'}</div>
      <div class="card-detail">intensity: ${fl.intensity || '?'} | pos: ${pos}</div>
    </div>`;
  }
  document.getElementById('fires').innerHTML = fireHtml;

  let personHtml = '<h2>Persons</h2>';
  for (const p of (s.persons || [])) {
    const pos = p.position ? `(${p.position[0]},${p.position[1]})` : '?';
    personHtml += `<div class="person-card">
      <div class="card-header">🧑 ${p.name || '?'}</div>
      <div class="card-detail">status: ${p.status || '?'} | load: ${p.load || '?'}</div>
      <div class="card-detail">pos: ${pos}</div>
    </div>`;
  }
  document.getElementById('persons').innerHTML = personHtml;
}

// SSE connection
const evtSource = new EventSource('/map/state');
evtSource.addEventListener('waiting', () => {
  document.getElementById('step-label').innerHTML = '<span style="color:#f59e0b;">⏳ Waiting for SARBarrier...</span>';
});
evtSource.onmessage = function(event) {
  try {
    const data = JSON.parse(event.data);
    renderGrid(data.snapshot);
    renderSidebar(data);
  } catch (e) {
    console.error('Parse error:', e);
  }
};
evtSource.onerror = function() {
  document.getElementById('step-label').innerHTML = '<span style="color:#e74c3c;">⚠ Connection lost — retrying...</span>';
};
</script>
</body>
</html>
