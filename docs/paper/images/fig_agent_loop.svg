<text x="48" y="628" font-size="12.5" text-anchor="start" font-weight="bold" fill="#1F2933"  >Agent loop ≠ static workflow</text>
<text x="48" y="654" font-size="10" text-anchor="start" font-weight="normal" fill="#1F2933"  >• The LLM selects the next tool every turn —</text>
<text x="48" y="670" font-size="10" text-anchor="start" font-weight="normal" fill="#1F2933"  >   no hard-coded action chain.</text>
<text x="48" y="686" font-size="10" text-anchor="start" font-weight="normal" fill="#1F2933"  >• Tool results re-enter the LLM context,</text>
<text x="48" y="702" font-size="10" text-anchor="start" font-weight="normal" fill="#1F2933"  >   closing the observe–act loop.</text>
<text x="48" y="718" font-size="10" text-anchor="start" font-weight="normal" fill="#1F2933"  >• Tools read &amp; write shared state: mission plan</text>
<text x="48" y="734" font-size="10" text-anchor="start" font-weight="normal" fill="#1F2933"  >   (K_t), semantic map (S_t), team status (T_t).</text>
