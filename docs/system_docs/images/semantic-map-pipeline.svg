      .code-blue { font: 13px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #1d5fa7; }
      .muted { font: 12px Inter, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #627d98; }
      .source { font: 12px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #627d98; }
      .chip { font: 700 12px Inter, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; }
      .chip-blue { fill: #1d5fa7; }
      .chip-teal { fill: #177a70; }
      .chip-orange { fill: #b66313; }
