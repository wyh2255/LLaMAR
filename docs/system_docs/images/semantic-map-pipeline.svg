      .band-teal { fill: #def6f0; }
      .band-cyan { fill: #e2f6fa; }
      .band-orange { fill: #ffedd5; }
      .node-title { font: 700 15px Inter, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #12304a; }
      .body { font: 13px Inter, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #243b53; }
      .body-strong { font: 700 13px Inter, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #173f5f; }
