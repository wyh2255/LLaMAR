  <!-- ============ 主管线 4-5（Coordinator 摄入，8 月改道重点） ============ -->
  <rect x="52" y="344" width="1396" height="330" rx="18" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
  <text x="76" y="374" class="sm-section">Coordinator 摄入 · 8 月改道：鉴权门 + canonical-first 双 sink</text>

  <rect x="76" y="394" width="440" height="260" rx="11" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8" filter="url(#sm-shadow)"/>
  <rect x="76" y="394" width="440" height="22" rx="11" fill="#dc2626"/>
  <text x="88" y="410" class="sm-badge-w">4 · Coordinator callback（新增 route-front 鉴权门）</text>
  <text x="92" y="438" class="sm-card-title">POST /a2a/push-callback → handle_push_notification</text>
  <text x="92" y="459" class="sm-card-meta">SignedPushNotificationSender 以 CallbackProofV1 对精确</text>
  <text x="92" y="476" class="sm-card-meta">序列化 body 签名；memory_read_mode ∈ {shadow, read_port}</text>
  <text x="92" y="493" class="sm-card-meta">时 verify_proof + reserve_nonce + sanitize_callback 先于</text>
  <text x="92" y="510" class="sm-card-meta">任何域写者执行——proof 失败零副作用（server.py:1558-1615）</text>
  <text x="92" y="535" class="sm-card-title">解析（真实生产函数）</text>
  <text x="92" y="556" class="sm-card-meta">_extract_observations_with_provenance：[DATA] 分块 →</text>
  <text x="92" y="573" class="sm-card-meta">structured_data.observations[]（worker_sensor_tool）+ legacy</text>
  <text x="92" y="590" class="sm-card-meta">report_observation（worker_observation），scope+step 去重；</text>
  <text x="92" y="607" class="sm-card-meta">_extract_observation_from_status_text 已 legacy 零调用</text>
  <text x="92" y="636" class="sm-src">server.py:1518-1519,1558-1615 · :99（callsite :1784）· :65,81,313</text>

  <rect x="548" y="394" width="440" height="260" rx="11" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8" filter="url(#sm-shadow)"/>
  <rect x="548" y="394" width="440" height="22" rx="11" fill="#dc2626"/>
  <text x="560" y="410" class="sm-badge-w">5a · canonical Memory（先写 · 8 月新增）</text>
  <text x="564" y="438" class="sm-card-title">_ingest_callback_to_memory</text>
  <text x="564" y="459" class="sm-card-meta">观测 + 遥测归一化为 NormalizedProjectionInputV1</text>
  <text x="564" y="476" class="sm-card-meta">（_normalize_observation_projection_inputs :903）；</text>
  <text x="564" y="493" class="sm-card-meta">MemoryIngestor.ingest_callback 把 callback Temporal 事件、</text>
  <text x="564" y="510" class="sm-card-meta">control receipts、evidence 与 projection reduce 打包成</text>
  <text x="564" y="527" class="sm-card-meta">一个全有或全无事务写 memory.sqlite3；</text>
  <text x="564" y="544" class="sm-card-meta">MemoryProjectionReducer 带 env_step fence；</text>
  <text x="564" y="561" class="sm-card-meta">禁透 oracle / ground_truth / direct-world 字段先剥离</text>
  <text x="564" y="578" class="sm-card-meta">（scan_forbidden_truth_fields）</text>
  <text x="564" y="603" class="sm-card-meta">canonical 真源 = spatial/temporal/embodied projections，</text>
  <text x="564" y="620" class="sm-card-meta">经 MemoryReadPort 读回（read_port 已是默认模式）</text>
  <text x="564" y="636" class="sm-src">server.py:858,903,1845 · ingestor.py:366 · projections.py:95</text>

  <rect x="1020" y="394" width="412" height="260" rx="11" fill="#ffffff" stroke="#fb923c" stroke-width="1.8" filter="url(#sm-shadow)"/>
  <text x="1036" y="418" class="sm-card-title">5b · legacy 配对 sink（受 canonical 门控）</text>
  <text x="1036" y="443" class="sm-card-meta">allow_legacy_observation_write：仅当 canonical ∈</text>
  <text x="1036" y="460" class="sm-card-meta">{ok, duplicate} 或 memory 未配置才执行（:1857-1862）</text>
  <text x="1036" y="485" class="sm-card-title">_ingest_observations_from_status（:1055）</text>
  <text x="1036" y="506" class="sm-card-meta">EventStore.append("observation_report")（:1100，</text>
  <text x="1036" y="523" class="sm-card-meta">已降级为 legacy debug adapter）</text>
  <text x="1036" y="540" class="sm-card-meta">+ SemanticMapStore.ingest_observation（:1106）：</text>
  <text x="1036" y="557" class="sm-card-meta">_merge_locked 二次去重 / noteworthy / revision++；</text>
  <text x="1036" y="574" class="sm-card-meta">semantic_map.jsonl 追加；per-(context,worker) 去重</text>
  <text x="1036" y="591" class="sm-card-meta">摄入独立于状态转移：stale_transition 仍摄入；</text>
  <text x="1036" y="608" class="sm-card-meta">新观测 → watchdog.record_progress</text>
  <text x="1036" y="632" class="sm-src">server.py:1055-1118 · map/store.py:275-344,426</text>
  <text x="1036" y="645" class="sm-src">· event_store.py:75</text>

