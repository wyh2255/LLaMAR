      .feedback-path { fill: none; stroke: #6b7c93; stroke-width: 2.2; stroke-dasharray: 8 6; stroke-linecap: round; stroke-linejoin: round; }
      .note-path { fill: none; stroke: #e58b2a; stroke-width: 1.5; stroke-linecap: round; }
