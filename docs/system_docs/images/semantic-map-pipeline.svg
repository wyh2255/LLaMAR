  <!-- ============ 主管线 6（投影与注入） ============ -->
  <rect x="52" y="690" width="1396" height="238" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="76" y="720" class="sm-section">6 · Runtime → LLM 注入（每轮 pre_llm 触发）</text>

  <rect x="76" y="740" width="440" height="168" rx="11" fill="#ffffff" stroke="#60a5fa" stroke-width="1.8" filter="url(#sm-shadow)"/>
  <text x="92" y="764" class="sm-card-title">SARCoordinatorStateProvider.prepare_for_llm</text>
  <text x="92" y="785" class="sm-card-meta">由 CoordinatorSARHooks.pre_llm → ContextManager.</text>
  <text x="92" y="802" class="sm-card-meta">prepare_runtime_state 驱动（旧图未画 hook 链）；</text>
  <text x="92" y="819" class="sm-card-meta">snapshot_with_revision() 原子读 (revision, snapshot)；</text>
  <text x="92" y="836" class="sm-card-meta">same-revision → no-op 早退仍在（:464-470），但 env step</text>
  <text x="92" y="853" class="sm-card-meta">独立 bump _runtime_version（:457-459）——地图静止</text>
  <text x="92" y="870" class="sm-card-meta">不再冻结 Context 版本</text>
  <text x="92" y="896" class="sm-src">coordinator_state_provider.py:22,438-515 · hooks.py:69-84</text>

  <rect x="548" y="740" width="440" height="168" rx="11" fill="#ffffff" stroke="#60a5fa" stroke-width="1.8" filter="url(#sm-shadow)"/>
  <text x="564" y="764" class="sm-card-title">revision diff / summary 反馈泳道</text>
  <text x="564" y="785" class="sm-card-meta">MapDiffCalculator.diff(prev, curr, base_revision, revision)：</text>
  <text x="564" y="802" class="sm-card-meta">fires / persons / conflicts / stale；无变化 delta=None；</text>
  <text x="564" y="819" class="sm-card-meta">agent movement 不计入 · diff.py:12-25</text>
  <text x="564" y="844" class="sm-card-title">MapSummarizer.maybe_summarize（单飞）</text>
  <text x="564" y="865" class="sm-card-meta">delta / 周期触发；per-revision single-flight（quick check</text>
  <text x="564" y="882" class="sm-card-meta">:101-106、double-check :108-111、atomic claim :121）；</text>
  <text x="564" y="899" class="sm-src">summarizer.py:33,76-181 · map/store.py:358-368</text>

  <rect x="1020" y="740" width="412" height="168" rx="11" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.8" filter="url(#sm-shadow)"/>
  <text x="1036" y="764" class="sm-card-title">Context Memory 渲染（coordinator）</text>
  <text x="1036" y="785" class="sm-card-meta">refresh_runtime_state → _project_runtime_state_to_pinned</text>
  <text x="1036" y="802" class="sm-card-meta">（semantic_summary / map_delta / map_summary /</text>
  <text x="1036" y="819" class="sm-card-meta">map_summary_revision…）→ CoordinatorContextManager.</text>
  <text x="1036" y="836" class="sm-card-meta">_render_environment_view 尾部 Environment State 块</text>
  <text x="1036" y="861" class="sm-card-title">→ Coordinator LLM 下一轮决策</text>
  <text x="1036" y="882" class="sm-card-meta">worker 侧同构组装但 viewer_role='worker'，</text>
  <text x="1036" y="899" class="sm-src">context.py:392,410,426-449,888,1105,1123,1258-1262</text>

  <line x1="516" y1="824" x2="548" y2="824" class="sm-blue"/>
  <line x1="988" y1="824" x2="1020" y2="824" class="sm-blue"/>
  <path d="M 296 740 L 296 700 L 1226 700 L 1226 740" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="6 5" stroke-linecap="round" marker-end="url(#sm-arrow-blue)"/>
  <text x="760" y="694" class="sm-edge-label">revision-based projection（同一因果链的读侧，不是第二条控制流）</text>

  <!-- ============ 权威边界带 ============ -->
  <rect x="52" y="944" width="1396" height="286" rx="18" fill="#faf5ff" stroke="#c4b5fd" stroke-width="2"/>
  <text x="76" y="974" class="sm-section-b">AUTHORITY BOUNDARY · 边界与失败语义（8 月新增 ACL 读侧）</text>

  <rect x="76" y="994" width="440" height="112" rx="11" fill="#ffffff" stroke="#a78bfa" stroke-width="1.8" filter="url(#sm-shadow)"/>
  <text x="92" y="1018" class="sm-card-title">物理完成权威不变</text>
  <text x="92" y="1039" class="sm-card-meta">SARBarrier.is_finished() / env.checker.check_success()</text>
  <text x="92" y="1056" class="sm-card-meta">决定 mission_finished；coordinator 经 _completion_</text>
  <text x="92" y="1073" class="sm-card-meta">validator 动态读取；semantic map 不覆盖完成状态</text>
  <text x="92" y="1094" class="sm-src">barrier.py:314-316 · server.py:1012-1020</text>

  <rect x="548" y="994" width="440" height="112" rx="11" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8" filter="url(#sm-shadow)"/>
  <rect x="548" y="994" width="440" height="22" rx="11" fill="#dc2626"/>
  <text x="560" y="1010" class="sm-badge-w">8 月新增 · worker 读侧 ACL</text>
  <text x="564" y="1038" class="sm-card-title">EnvironmentStateProvider（read-port 组合根）</text>
  <text x="564" y="1059" class="sm-card-meta">query_environment_state：viewer ACL 在 provider 内、</text>
  <text x="564" y="1076" class="sm-card-meta">token 预算分段、FRESH/STALE/UNAVAILABLE 三态；</text>
  <text x="564" y="1093" class="sm-card-meta">worker 视图降级为 identity-only 快照</text>
  <text x="564" y="1101" class="sm-src">env_state_provider.py:279,370 · store.py:370-391</text>

  <rect x="1020" y="994" width="412" height="122" rx="11" fill="#ffffff" stroke="#a78bfa" stroke-width="1.8" filter="url(#sm-shadow)"/>
  <text x="1036" y="1016" class="sm-card-title">可选失败语义（保持上次成功）</text>
  <text x="1036" y="1036" class="sm-card-meta">same revision → StateProvider no-op；summary 缺失 /</text>
  <text x="1036" y="1052" class="sm-card-meta">超时 / 出错 → 保留 last success；refresh 失败 →</text>
  <text x="1036" y="1068" class="sm-card-meta">stale=True + refresh_error；revision 递增不止于观测</text>
  <text x="1036" y="1084" class="sm-card-meta">ingest（init_priors :210 / step_budget :221 也 bump）</text>
  <text x="1036" y="1095" class="sm-src">coordinator_state_provider.py:464-470</text>
  <text x="1036" y="1107" class="sm-src">· map/store.py:210,221,312</text>

  <rect x="76" y="1126" width="1356" height="88" rx="11" fill="#ffffff" stroke="#a78bfa" stroke-width="1.8" filter="url(#sm-shadow)"/>
  <text x="92" y="1150" class="sm-card-title">语义状态 vs 环境真值</text>
  <text x="92" y="1171" class="sm-card-meta">SemanticMapStore.snapshot() = Worker 观测的合并视图（fires · persons · agents · stale · conflicts · unknowns）——是观测状态，不是环境 ground truth；</text>
  <text x="92" y="1188" class="sm-card-meta">canonical memory（memory.sqlite3 projections）为 8 月起的正式真源通道，SemanticMapStore 转为 legacy paired sink；两 sink 由同一 callback 原子驱动。</text>
