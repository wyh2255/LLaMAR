<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">LLaMAR Semantic Map observation pipeline</title>
  <desc id="svg-desc">源码可追溯的语义地图观测摄入、状态投影与 Coordinator LLM 上下文注入流程图。主线从 Worker SAR tool result 经过 A2A push callback、EventStore 与 SemanticMapStore，最终进入 StateProvider、ContextManager 与 Coordinator LLM；下方为 revision diff 与可选摘要的反馈投影支线。</desc>
  <metadata id="source-boundary">
    Source boundary: docs/system_docs/semantic_map.md sections 4-5; current implementation in sar_orch/barrier.py, sar_orch/tools/worker/_barrier_helpers.py, sar_orch/map/{publisher.py,store.py,diff.py,summarizer.py}, src/a2a/worker/sink.py, src/a2a/coordinator/server.py, sar_orch/coordinator_state_provider.py, src/Agent/router_agent/{hooks.py,context.py,agent.py}. Legacy report_observation parsing is compatibility-only and is not drawn as the primary spine.
  </metadata>
  <defs>
    <style><![CDATA[
      .canvas { fill: #ffffff; }
      .title { font: 700 26px Inter, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #102a43; letter-spacing: .2px; }
      .subtitle { font: 13px Inter, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #52606d; }
      .section { font: 700 14px Inter, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #1f4e79; letter-spacing: .2px; }
