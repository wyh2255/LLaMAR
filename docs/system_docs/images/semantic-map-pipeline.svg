  <text x="56" y="66" class="sm-title">Semantic Map 管线：观测 → 摄入 → 投影 → 注入 Coordinator Context</text>
  <text x="56" y="94" class="sm-subtitle">源码可追溯 · HEAD 22c5f4e · 红标 = 8 月新增 / 改道 · 紫虚线 = revision 投影，非第二条物理控制流</text>

  <!-- ============ 主管线 1-3（Worker 侧） ============ -->
  <rect x="52" y="116" width="1396" height="212" rx="18" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
  <text x="76" y="146" class="sm-section">Worker 侧 · 观测产生与预过滤</text>

  <rect x="76" y="166" width="440" height="152" rx="11" fill="#ffffff" stroke="#16a34a" stroke-width="1.8" filter="url(#sm-shadow)"/>
  <text x="92" y="190" class="sm-card-title">1 · Worker SAR result</text>
  <text x="92" y="211" class="sm-card-meta">SARBarrier.submit_action() 全员汇合 → env.step(actions) → obs；</text>
  <text x="92" y="228" class="sm-card-meta">tool_result_from_barrier() 构造 ToolResult.data（可为 None）；</text>
  <text x="92" y="245" class="sm-card-meta">8 月新语义：advance=False 空闲心跳、全占位无限等待</text>
  <text x="92" y="262" class="sm-card-meta">→ Worker 消息历史以 &lt;structured_observations&gt; 呈现</text>
  <text x="92" y="292" class="sm-src">sar_orch/barrier.py:154-307,161-170,196-229</text>
  <text x="92" y="309" class="sm-src">sar_orch/tools/worker/_barrier_helpers.py:19-79</text>

  <rect x="548" y="166" width="440" height="152" rx="11" fill="#ffffff" stroke="#16a34a" stroke-width="1.8" filter="url(#sm-shadow)"/>
  <text x="564" y="190" class="sm-card-title">2 · Worker-side filter（预去重）</text>
  <text x="564" y="211" class="sm-card-meta">WorkerReportPublisher.apply_to_data() →</text>
  <text x="564" y="228" class="sm-card-meta">filter_new_observations()：key = name | type:position，</text>
  <text x="564" y="245" class="sm-card-meta">仅保留 new / changed；obs[] 非空或有 overrides</text>
  <text x="564" y="262" class="sm-card-meta">才创建 data；在 barrier helper 内调用（非 post_tool</text>
  <text x="564" y="279" class="sm-card-meta">hook）；publisher 于 worker 进程装配；</text>
  <text x="564" y="292" class="sm-src">sar_orch/map/publisher.py:35,52,73-86</text>
  <text x="564" y="309" class="sm-src">sar_orch/worker.py:454-461 · observation_publisher.py:1-10</text>

  <rect x="1020" y="166" width="412" height="152" rx="11" fill="#ffffff" stroke="#16a34a" stroke-width="1.8" filter="url(#sm-shadow)"/>
  <text x="1036" y="190" class="sm-card-title">3 · A2A transport</text>
  <text x="1036" y="211" class="sm-card-meta">A2AWorkerSink.emit("tool_result")：data is not None →</text>
  <text x="1036" y="228" class="sm-card-meta">structured_data 进 payload；status text = "[Result] …" +</text>
  <text x="1036" y="245" class="sm-card-meta">[DATA] {json}（content 上限 12000）→ WORKING 事件 push；</text>
  <text x="1036" y="262" class="sm-card-meta">8 月新增：payload 深度脱敏（_redact_payload）+</text>
  <text x="1036" y="279" class="sm-card-meta">公开 error_code 随 [DATA] 携带（原始错误文本不外泄）</text>
  <text x="1036" y="292" class="sm-src">src/a2a/worker/sink.py:29-31,53-119</text>
  <text x="1036" y="309" class="sm-src">src/a2a/worker/agent_adapter.py:204</text>

