      .note-body { font: 12.5px Inter, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #6b4a25; }
      .legend { font: 12.5px Inter, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #334e68; }
      .footer { font: 12px Inter, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #52606d; }
    ]]></style>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f80ed"/>
    </marker>
    <marker id="arrow-feedback" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7c93"/>
    </marker>
  </defs>

  <rect id="background" class="canvas" x="0" y="0" width="1600" height="1100"/>

  <!-- Header -->
  <text x="40" y="43" class="title">LLaMAR Semantic Map observation pipeline</text>
  <text x="40" y="70" class="subtitle">源码可追溯 · current runtime path · semantic mode · observation state → next Context Memory</text>
  <g id="authority-boundary" data-source="sar_orch/barrier.py:242-244,441; sar_orch/coordinator_state_provider.py:230-264">
    <rect x="950" y="18" width="610" height="78" rx="12" class="card-orange card"/>
    <rect x="950" y="18" width="610" height="28" rx="12" class="band-orange"/>
    <rect x="950" y="32" width="610" height="14" class="band-orange"/>
    <text x="968" y="37" class="chip chip-orange">AUTHORITY BOUNDARY / 边界</text>
    <text x="968" y="62" class="note-body"><tspan font-weight="700">Barrier / environment</tspan><tspan>：physical completion（</tspan><tspan class="code" fill="#8a4b08">is_finished()</tspan><tspan>）权威</tspan></text>
    <text x="968" y="83" class="note-body"><tspan font-weight="700">SemanticMapStore</tspan><tspan>：observation state；不等于 ground truth</tspan></text>
  </g>

  <text x="40" y="122" class="section">主执行 / observation ingest spine</text>
  <text x="1560" y="122" text-anchor="end" class="section-muted">solid blue arrows = one causal handoff per stage</text>

  <!-- Main spine connectors are drawn before cards so arrowheads terminate at card edges. -->
  <g id="main-spine" data-route="main-execution-data-path">
    <path id="main-1-2" class="main-path" d="M 278 285 H 300" marker-end="url(#arrow-blue)"/>
    <path id="main-2-3" class="main-path" d="M 538 285 H 560" marker-end="url(#arrow-blue)"/>
    <path id="main-3-4" class="main-path" d="M 798 285 H 820" marker-end="url(#arrow-blue)"/>
    <path id="main-4-5" class="main-path" d="M 1058 285 H 1080" marker-end="url(#arrow-blue)"/>
    <path id="main-5-6" class="main-path" d="M 1318 285 H 1340" marker-end="url(#arrow-blue)"/>
  </g>

  <!-- Stage 1 -->
  <g id="stage-worker-result" data-source="sar_orch/barrier.py:141-236,341-380; sar_orch/tools/worker/_barrier_helpers.py:21-64">
    <rect x="40" y="150" width="235" height="270" rx="16" class="card card-blue"/>
    <rect x="40" y="150" width="235" height="44" rx="16" class="band-blue"/>
    <rect x="40" y="178" width="235" height="16" class="band-blue"/>
    <text x="56" y="179" class="node-title">1 · Worker SAR result</text>
    <text x="56" y="218" class="body-strong">Worker SAR tool result</text>
    <text x="56" y="242" class="code-blue">SARBarrier.submit_action()</text>
    <text x="56" y="266" class="body">env.step(actions) → obs</text>
    <text x="56" y="292" class="code-blue">tool_result_from_barrier()</text>
    <text x="56" y="318" class="body">ToolResult.data（可为 None）</text>
    <text x="56" y="336" class="code-blue">&lt;structured_observations&gt;</text>
    <text x="56" y="352" class="muted" style="font-size: 11.5px;" data-condition="仅当 result.data 非空或存在 overrides 而创建并发布 data envelope 时，position / inventory 才随 observation report 发布；无 envelope 时不进入该发布路径。">
      <tspan x="56" dy="0">仅当 result.data 非空或存在 overrides 而</tspan>
      <tspan x="56" dy="13">创建并发布 data envelope 时，position /</tspan>
      <tspan x="56" dy="13">inventory 才随 observation report 发布；</tspan>
      <tspan x="56" dy="13">无 envelope 时不进入该发布路径。</tspan>
    </text>
    <text x="56" y="403" class="source">src: barrier.py:141–236</text>
    <text x="56" y="416" class="source">_barrier_helpers.py:21–64</text>
  </g>

  <!-- Stage 2 -->
  <g id="stage-publisher" data-symbol="WorkerReportPublisher.apply_to_data()" data-source="sar_orch/map/publisher.py:15-86">
    <rect x="300" y="150" width="235" height="270" rx="16" class="card card-teal"/>
    <rect x="300" y="150" width="235" height="44" rx="16" class="band-teal"/>
    <rect x="300" y="178" width="235" height="16" class="band-teal"/>
    <text x="316" y="179" class="node-title">2 · Worker-side filter</text>
    <text x="316" y="218" class="body-strong">WorkerReportPublisher</text>
    <text x="316" y="242" class="code">apply_to_data()</text>
    <text x="316" y="268" class="code">filter_new_observations()</text>
    <text x="316" y="294" class="body">key = name | type:position</text>
    <text x="316" y="320" class="body">compare position / attrs / confidence</text>
    <text x="316" y="346" class="body-strong">pre-dedup：仅保留 new / changed</text>
    <text x="316" y="371" class="muted">obs[] 非空或 overrides 存在 → 创建 data</text>
    <text x="316" y="396" class="source">src: map/publisher.py:15–86</text>
  </g>

  <!-- Stage 3 -->
  <g id="stage-a2a-sink" data-source="src/a2a/worker/sink.py:79-99">
    <rect x="560" y="150" width="235" height="270" rx="16" class="card card-blue"/>
    <rect x="560" y="150" width="235" height="44" rx="16" class="band-blue"/>
    <rect x="560" y="178" width="235" height="16" class="band-blue"/>
    <text x="576" y="179" class="node-title">3 · A2A transport</text>
    <text x="576" y="218" class="body-strong">A2AWorkerSink</text>
    <text x="576" y="242" class="code-blue">emit("tool_result")</text>
    <text x="576" y="268" class="body">data is not None → structured_data</text>
    <text x="576" y="294" class="body">payload：ev = tool_result</text>
    <text x="576" y="320" class="code-blue">[DATA] {json}</text>
    <text x="576" y="346" class="body">TaskStatusUpdateEvent(WORKING)</text>
    <text x="576" y="371" class="body-strong">A2A push notification</text>
    <text x="576" y="396" class="source">src: worker/sink.py:79–99</text>
  </g>

  <!-- Stage 4 -->
  <g id="stage-coordinator-callback" data-symbols="_extract_worker_data_blocks(); _extract_auto_observations()" data-source="src/a2a/coordinator/server.py:97-138,390-432,833-1000">
    <rect x="820" y="150" width="235" height="270" rx="16" class="card card-teal"/>
    <rect x="820" y="150" width="235" height="44" rx="16" class="band-teal"/>
    <rect x="820" y="178" width="235" height="16" class="band-teal"/>
    <text x="836" y="179" class="node-title">4 · Coordinator callback</text>
    <text x="836" y="218" class="code">POST /a2a/push-callback</text>
    <text x="836" y="244" class="body">status_text → [DATA] blocks</text>
    <text x="836" y="268" class="code">_extract_worker_data_</text>
    <text x="836" y="288" class="code">blocks()</text>
    <text x="836" y="312" class="body-strong">auto observation extraction</text>
    <text x="836" y="336" class="code">_extract_auto_observations()</text>
    <text x="836" y="360" class="body">structured_data.observations[]</text>
    <text x="836" y="384" class="muted">scope + step key dedup</text>
    <text x="836" y="404" class="source">src: server.py:97–138</text>
  </g>

  <!-- Stage 5 -->
  <g id="stage-map-ingest" data-symbol="SemanticMapStore.ingest_observation(obs)" data-source="src/a2a/coordinator/server.py:390-432; sar_orch/map/store.py:244-298,351-417,456-509">
    <rect x="1080" y="150" width="235" height="270" rx="16" class="card card-teal"/>
    <rect x="1080" y="150" width="235" height="44" rx="16" class="band-teal"/>
    <rect x="1080" y="178" width="235" height="16" class="band-teal"/>
    <text x="1096" y="179" class="node-title">5 · Canonical map ingest</text>
    <text x="1096" y="218" class="code">EventStore.append(</text>
    <text x="1096" y="240" class="code">  "observation_report")</text>
    <text x="1096" y="268" class="body-strong">SemanticMapStore.</text>
    <text x="1096" y="290" class="body-strong">ingest_observation(obs)</text>
    <text x="1096" y="316" class="code">_merge_locked()</text>
    <text x="1096" y="341" class="body">merge + second dedup / noteworthy</text>
    <text x="1096" y="366" class="body-strong">revision++</text>
    <text x="1096" y="390" class="body">semantic_map.jsonl append</text>
    <text x="1096" y="408" class="source">store.py:244–298 / 351–417</text>
  </g>

  <!-- Stage 6 -->
  <g id="stage-runtime-llm" data-source="sar_orch/coordinator_state_provider.py:107-186,230-291; src/Agent/router_agent/hooks.py:70-84; src/Agent/router_agent/agent.py:509-522">
    <rect x="1340" y="150" width="220" height="270" rx="16" class="card card-blue"/>
    <rect x="1340" y="150" width="220" height="44" rx="16" class="band-blue"/>
    <rect x="1340" y="178" width="220" height="16" class="band-blue"/>
    <text x="1356" y="179" class="node-title">6 · Runtime → LLM</text>
    <text x="1356" y="218" class="body-strong">SARCoordinatorStateProvider</text>
    <text x="1356" y="242" class="code-blue">prepare_for_llm()</text>
    <text x="1356" y="268" class="body">snapshot() → RuntimeState</text>
    <text x="1356" y="294" class="body-strong">CoordinatorContextManager</text>
    <text x="1356" y="320" class="body">refresh → assemble</text>
    <text x="1356" y="342" class="body">Context Memory</text>
    <text x="1356" y="366" class="body">map_delta / map_summary /</text>
    <text x="1356" y="388" class="body">semantic_summary</text>
    <text x="1356" y="410" class="body-strong">Coordinator LLM</text>
  </g>

  <!-- Feedback / state projection lane -->
  <text x="40" y="475" class="section">反馈 / state projection lane</text>
  <text x="40" y="497" class="section-muted">虚线只表示 revision-based projection / context feedback；不是另一条物理控制流</text>

  <g id="projection-lane" data-route="map-diff-summary-context-feedback">
    <path id="projection-store-to-snapshot" class="feedback-path" d="M 1198 423 L 815 520" marker-end="url(#arrow-feedback)"/>
    <path id="projection-snapshot-to-diff" class="feedback-path" d="M 943 615 H 962" marker-end="url(#arrow-feedback)"/>
    <path id="projection-diff-to-summary" class="feedback-path" d="M 1218 615 H 1237" marker-end="url(#arrow-feedback)"/>
    <path id="projection-to-context" class="feedback-path" d="M 1400 518 V 420" marker-end="url(#arrow-feedback)"/>
  </g>

  <!-- Projection card 1 -->
  <g id="projection-snapshot" data-source="sar_orch/map/store.py:312-322; sar_orch/coordinator_state_provider.py:94-150">
    <rect x="690" y="520" width="253" height="190" rx="14" class="card card-cyan"/>
    <rect x="690" y="520" width="253" height="40" rx="14" class="band-cyan"/>
    <rect x="690" y="546" width="253" height="14" class="band-cyan"/>
    <text x="706" y="546" class="node-title">1 · Atomic snapshot</text>
    <text x="706" y="585" class="code">snapshot_with_revision()</text>
    <text x="706" y="611" class="body">(revision, snapshot) under lock</text>
    <text x="706" y="637" class="body">SemanticMapStore → StateProvider</text>
    <text x="706" y="663" class="body-strong">same revision → no-op</text>
    <text x="706" y="688" class="muted">env step still advances runtime version</text>
  </g>

  <!-- Projection card 2 -->
  <g id="projection-diff" data-source="sar_orch/map/diff.py:19-104,110-277; sar_orch/coordinator_state_provider.py:152-168">
    <rect x="965" y="520" width="253" height="190" rx="14" class="card card-cyan"/>
    <rect x="965" y="520" width="253" height="40" rx="14" class="band-cyan"/>
    <rect x="965" y="546" width="253" height="14" class="band-cyan"/>
    <text x="981" y="546" class="node-title">2 · Structured diff</text>
    <text x="981" y="585" class="code">MapDiffCalculator.diff()</text>
    <text x="981" y="611" class="body">prev snapshot → curr snapshot</text>
    <text x="981" y="637" class="body">base_revision → revision</text>
    <text x="981" y="663" class="body">fires / persons / conflicts / stale</text>
    <text x="981" y="684" class="muted">无变化：delta = None</text>
    <text x="981" y="704" class="muted">agent movement 不计入</text>
  </g>

  <!-- Projection card 3 -->
  <g id="projection-summary-context" data-source="sar_orch/map/summarizer.py:76-178,187-238; sar_orch/coordinator_state_provider.py:170-184; src/Agent/router_agent/context.py:169-224">
    <rect x="1240" y="520" width="320" height="190" rx="14" class="card card-orange"/>
    <rect x="1240" y="520" width="320" height="40" rx="14" class="band-orange"/>
    <rect x="1240" y="546" width="320" height="14" class="band-orange"/>
    <text x="1256" y="546" class="node-title">3 · Optional summary → context</text>
    <text x="1256" y="585" class="code">MapSummarizer.maybe_summarize()</text>
    <text x="1256" y="611" class="body">optional：triggered by delta / periodic</text>
    <text x="1256" y="637" class="body-strong">map_delta → map_summary</text>
    <text x="1256" y="663" class="body">RuntimeState.payload：semantic_summary</text>
    <text x="1256" y="688" class="body-strong">→ next Context Memory</text>
  </g>

  <!-- Boundary and failure notes: explanatory notes, deliberately no control arrows. -->
  <g id="boundary-notes">
    <rect x="40" y="770" width="470" height="132" rx="14" class="card card-orange"/>
    <text x="58" y="797" class="note-title">物理完成权威 / Physical authority</text>
    <text x="58" y="824" class="note-body">SARBarrier.is_finished() / env.checker.check_success()</text>
    <text x="58" y="850" class="note-body">决定 mission_finished；semantic map 不覆盖完成状态。</text>
    <text x="58" y="877" class="source">barrier.py:242–244, 441; state_provider.py:230–235</text>

    <rect x="535" y="770" width="500" height="132" rx="14" class="card card-teal"/>
    <text x="553" y="797" class="chip chip-teal">语义状态 / Observation state</text>
    <text x="553" y="824" class="body">SemanticMapStore.snapshot() = Worker 观测的合并视图</text>
    <text x="553" y="850" class="body">fires · persons · agents · stale · conflicts · unknowns</text>
    <text x="553" y="877" class="muted">semantic map 是观测状态，不是环境 ground truth。</text>

    <rect x="1060" y="770" width="500" height="132" rx="14" class="card card-orange"/>
    <text x="1078" y="797" class="note-title">可选失败 / feedback notes</text>
    <text x="1078" y="824" class="note-body">same revision → StateProvider no-op</text>
    <text x="1078" y="850" class="note-body">summary absent / timeout / error → keep last success</text>
    <text x="1078" y="877" class="note-body">refresh failure → stale=True + refresh_error</text>
  </g>

  <!-- Legend: only the two line types that are actually used. -->
  <g id="legend">
    <text x="40" y="950" class="section">图例 / Legend</text>
    <path class="main-path" d="M 160 946 H 210" marker-end="url(#arrow-blue)"/>
    <text x="224" y="951" class="legend">主执行 / observation ingest data path</text>
    <path class="feedback-path" d="M 520 946 H 570" marker-end="url(#arrow-feedback)"/>
    <text x="584" y="951" class="legend">revision diff / summary / context projection</text>
  </g>

  <!-- Source boundary footer -->
  <line x1="40" y1="985" x2="1560" y2="985" stroke="#d9e2ec" stroke-width="1"/>
  <text x="40" y="1012" class="footer">来源边界：docs/system_docs/semantic_map.md §4–§5；当前实现：barrier.py、_barrier_helpers.py、map/{publisher,store,diff,summarizer}.py、worker/sink.py、coordinator/server.py、coordinator_state_provider.py、router_agent/{hooks,context,agent}.py。</text>
  <text x="40" y="1038" class="footer">图示只把 structured_data.observations[] 作为主摄入路径；report_observation 的旧格式解析保留为兼容分支，未伪装成主控制流。</text>
  <text x="1560" y="1070" text-anchor="end" class="source">standalone SVG · editable shapes/text · source-grounded snapshot</text>
</svg>
