  <text x="750" y="94" text-anchor="middle" class="arch-subtitle">sar_orch 编排层组合 src/a2a 传输 + src/Agent ReAct 内核并操控 SAR 仿真引擎；canonical Memory 为唯一官方记忆路径（read_port 已退休）</text>

