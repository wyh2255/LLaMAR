<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1230" role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">LLaMAR SAR 系统架构（2026-08）</title>
  <desc id="arch-desc">三层依赖：sar_orch 编排层（Experiment Runner 启动 Coordinator 控制面与 Worker 执行面，经 A2A 双通道传输）组合域无关的 src/a2a 传输与 src/Agent ReAct 内核，并操控 SAR 仿真引擎。2026-08 新增模块单独成带：canonical Memory 系统（13 文件，read_port 已退休，唯一官方记忆路径）、DiagnosisLoop 诊断审查者、long_term_reflection 反思者、诊断与长期记忆内核、状态投影三件套、观测上报兼容层、Worker MCP 配置、Dashboard 启动器。Coordinator 决策事件写入 canonical memory；DiagnosisLoop 产出 System Health 段、反思者产出 Long-term Memory 段，均经状态投影 ACL 门控回注 Coordinator（worker 永不可见）；Worker 动作经 SARBarrier 汇合推进 SAREnv，观测回传并摄入 SemanticMapStore；ExperimentLogger 统一落盘。</desc>
  <defs>
    <filter id="arch-shadow" x="-12%" y="-12%" width="124%" height="132%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.09"/>
    </filter>
    <marker id="arch-arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#2563eb"/></marker>
    <marker id="arch-arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#d97706"/></marker>
    <marker id="arch-arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#059669"/></marker>
    <marker id="arch-arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#7c3aed"/></marker>
    <marker id="arch-arrow-fuchsia" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#e879f9"/></marker>
