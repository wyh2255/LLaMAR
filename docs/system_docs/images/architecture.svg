    <text x="94" y="982" class="arch-note">D8 fail-closed：诊断 / 反思缺 store、配置或模型端口时 typed 跳过、超时丢弃，绝不阻塞主链路</text>
    <text x="94" y="1002" class="arch-note">System Health / Long-term 段 ACL 门控（environment_state_provider.py:441-459）· worker 永不可见</text>
