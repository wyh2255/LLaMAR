<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 970" role="img" aria-labelledby="architecture-title architecture-desc">
  <title id="architecture-title">LLaMAR SAR 系统架构</title>
  <desc id="architecture-desc">从 Experiment Runner 启动 Coordinator 和 Worker。Coordinator 通过 A2A HTTP 派发任务到 Worker，Worker 通过 push callback 回传状态和结果；Worker 动作经 SARBarrier 汇合并推进 SAREnv。语义地图和实验日志是共享服务。</desc>
  <defs>
    <filter id="arch-shadow" x="-12%" y="-12%" width="124%" height="132%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.09"/>
    </filter>
    <marker id="arch-control-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0 0 L10 5 L0 10Z" fill="#2563eb"/>
    </marker>
    <marker id="arch-task-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0 0 L10 5 L0 10Z" fill="#d97706"/>
    </marker>
    <marker id="arch-result-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0 0 L10 5 L0 10Z" fill="#059669"/>
    </marker>
    <style>
      .title { fill:#0f172a; font:700 30px 'Inter','PingFang SC','Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif; }
      .subtitle { fill:#334155; font:400 16px 'Inter','PingFang SC','Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif; }
      .legend { fill:#475569; font:500 14px 'Inter','PingFang SC','Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif; }
      .section { fill:#1e3a8a; font:700 17px 'Inter','PingFang SC','Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif; }
      .section-note { fill:#64748b; font:400 14px 'Inter','PingFang SC','Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif; }
      .card-title { fill:#0f172a; font:700 17px 'Inter','PingFang SC','Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif; }
      .card-body { fill:#334155; font:400 15px 'Inter','PingFang SC','Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif; }
      .card-meta { fill:#475569; font:400 13px 'Inter','PingFang SC','Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif; }
      .inverse-title { fill:#ffffff; font:700 18px 'Inter','PingFang SC','Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif; }
      .inverse-body { fill:#dbeafe; font:400 15px 'Inter','PingFang SC','Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif; }
      .edge-label { fill:#334155; font:600 14px 'Inter','PingFang SC','Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif; paint-order:stroke; stroke:#ffffff; stroke-width:5px; stroke-linejoin:round; }
      .caption { fill:#475569; font:400 14px 'Inter','PingFang SC','Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif; }
      .control { fill:none; stroke:#2563eb; stroke-width:3; stroke-linecap:round; marker-end:url(#arch-control-arrow); }
      .task { fill:none; stroke:#d97706; stroke-width:3; stroke-linecap:round; marker-end:url(#arch-task-arrow); }
      .result { fill:none; stroke:#059669; stroke-width:3; stroke-linecap:round; marker-end:url(#arch-result-arrow); }
    </style>
  </defs>

  <rect width="1500" height="970" fill="#f8fafc"/>
  <rect x="28" y="24" width="1444" height="922" rx="24" fill="#ffffff" stroke="#dbe4ef" stroke-width="2"/>

  <text x="750" y="68" text-anchor="middle" class="title">LLaMAR SAR 系统架构</text>
  <text x="750" y="96" text-anchor="middle" class="subtitle">只保留一条任务主线和一条结果回线；状态与日志以组件归属表达，不再额外拉线</text>

  <g aria-label="图例">
    <line x1="220" y1="132" x2="268" y2="132" class="control"/>
    <text x="282" y="137" class="legend">启动 / 环境动作</text>
    <line x1="560" y1="132" x2="608" y2="132" class="task"/>
    <text x="622" y="137" class="legend">A2A 任务下发</text>
    <line x1="900" y1="132" x2="948" y2="132" class="result"/>
    <text x="962" y="137" class="legend">状态 / 结果回推</text>
  </g>

  <!-- Entry -->
  <g aria-label="实验入口">
    <rect x="525" y="160" width="450" height="94" rx="16" fill="#1d4ed8" filter="url(#arch-shadow)"/>
    <text x="555" y="198" class="inverse-title">Experiment Runner</text>
    <text x="555" y="224" class="inverse-body">sar_orch/experiment.py · run_experiment()</text>
    <text x="555" y="245" class="inverse-body">创建环境与日志，然后启动 Coordinator 与 N 个 Worker</text>
  </g>
  <text x="440" y="318" text-anchor="middle" class="edge-label">启动 Coordinator</text>
  <text x="1060" y="318" text-anchor="middle" class="edge-label">启动 Worker × N</text>

  <!-- Coordinator plane -->
  <g aria-label="Coordinator 控制面">
    <rect x="70" y="300" width="500" height="360" rx="20" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
    <rect x="94" y="324" width="206" height="34" rx="17" fill="#dbeafe"/>
    <text x="114" y="347" class="section">Coordinator · 控制面</text>
    <text x="322" y="347" class="section-note">决定“做什么”</text>

    <rect x="94" y="380" width="452" height="50" rx="11" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
    <text x="116" y="411" class="card-title">CoordinatorServer · FastAPI :8080</text>

    <rect x="94" y="445" width="452" height="70" rx="11" fill="#ffffff" stroke="#60a5fa" stroke-width="1.8" filter="url(#arch-shadow)"/>
    <text x="116" y="473" class="card-title">RouterAgent + MissionRuntime / MissionGraph</text>
    <text x="116" y="497" class="card-meta">规划、DAG gate、原子 claim 与任务派发</text>

    <rect x="94" y="535" width="452" height="82" rx="11" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
    <text x="116" y="563" class="card-title">SARCoordinatorStateProvider</text>
    <text x="116" y="587" class="card-meta">读取 barrier、SemanticMap、EventStore、SupervisionState</text>
    <text x="116" y="606" class="card-meta">并把动态状态注入下一轮 Context Memory</text>
  </g>

  <!-- Transport: information is grouped here, not represented by extra crossing lines. -->
  <g aria-label="A2A 双通道传输">
    <rect x="650" y="385" width="200" height="190" rx="18" fill="#fff7ed" stroke="#fdba74" stroke-width="2" filter="url(#arch-shadow)"/>
    <text x="750" y="420" text-anchor="middle" class="section">A2A 双通道</text>
    <text x="750" y="465" text-anchor="middle" class="card-title">A2A HTTP :8081</text>
    <text x="750" y="487" text-anchor="middle" class="card-meta">JSON-RPC · task dispatch</text>
    <text x="750" y="538" text-anchor="middle" class="card-title">WebSocket :8080</text>
    <text x="750" y="559" text-anchor="middle" class="card-meta">仅注册 / 心跳</text>
  </g>

  <!-- Worker plane -->
  <g aria-label="Worker 执行面">
    <rect x="930" y="300" width="500" height="360" rx="20" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
    <rect x="954" y="324" width="202" height="34" rx="17" fill="#dcfce7"/>
    <text x="974" y="347" class="section">Worker × N · 执行面</text>
    <text x="1178" y="347" class="section-note">决定“怎么做”</text>

    <rect x="954" y="380" width="452" height="50" rx="11" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5"/>
    <text x="976" y="411" class="card-title">A2A Worker Server · :8191+i</text>

    <rect x="954" y="445" width="452" height="70" rx="11" fill="#ffffff" stroke="#4ade80" stroke-width="1.8" filter="url(#arch-shadow)"/>
    <text x="976" y="473" class="card-title">WorkerAgent（ReAct）</text>
    <text x="976" y="497" class="card-meta">LLM 选工具；结果回填消息历史；接收观测后继续推理</text>

    <rect x="954" y="535" width="452" height="70" rx="11" fill="#ffffff" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="976" y="563" class="card-title">SAR 领域工具</text>
    <text x="976" y="587" class="card-meta">Navigate / Explore / UseSupply / Carry / ReportObservation …</text>
  </g>

  <!-- Bottom plane: no secondary cross-links. -->
  <g aria-label="环境与共享服务">
    <rect x="70" y="700" width="500" height="135" rx="18" fill="#faf5ff" stroke="#d8b4fe" stroke-width="2"/>
    <rect x="94" y="723" width="172" height="32" rx="16" fill="#ede9fe"/>
    <text x="114" y="745" class="section">共享服务</text>
    <text x="94" y="782" class="card-title">SemanticMapStore</text>
    <text x="94" y="805" class="card-meta">ReportObservation 经 push callback 入图，按 step 新鲜度合并</text>
    <text x="94" y="826" class="card-title">ExperimentLogger</text>
    <text x="280" y="826" class="card-meta">trajectory · interactions · tokens · events</text>

    <rect x="930" y="700" width="500" height="135" rx="18" fill="#ecfeff" stroke="#67e8f9" stroke-width="2" filter="url(#arch-shadow)"/>
    <text x="955" y="739" class="card-title">SARBarrier + SAREnv</text>
    <text x="955" y="766" class="card-body">收集 N 个 action；全员到达或 60s 超时后 execute_step</text>
    <text x="955" y="791" class="card-meta">SAREnv.step(actions) 原子推进，并向 Worker 广播 observation</text>
    <text x="955" y="814" class="card-meta">动作提交 ↑ 上方 Worker 工具；观测返回由 WorkerAgent 卡片承担</text>
  </g>

  <!-- Every line stays in whitespace and is drawn last so arrowheads remain visible. -->
  <path d="M650 254 L320 300" class="control"/>
  <path d="M850 254 L1180 300" class="control"/>
  <path d="M546 465 H650" class="task"/>
  <path d="M850 465 H954" class="task"/>
  <path d="M954 505 H850" class="result"/>
  <path d="M650 505 H546" class="result"/>
  <path d="M1180 605 V700" class="control"/>
  <text x="598" y="447" text-anchor="end" class="edge-label">任务下发</text>
  <text x="902" y="447" class="edge-label">任务下发</text>
  <text x="598" y="528" text-anchor="end" class="edge-label">状态 / 结果</text>
  <text x="902" y="528" class="edge-label">状态 / 结果</text>
  <text x="1200" y="665" class="edge-label">actions</text>

  <text x="750" y="895" text-anchor="middle" class="caption">读图要点：任务只沿橙色主线从 Coordinator 到 Worker；结果只沿绿色回线返回。语义地图、状态投影和日志不再额外拉跨图连线。</text>
</svg>
