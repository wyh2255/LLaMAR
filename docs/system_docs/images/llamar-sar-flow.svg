<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1100" role="img" aria-labelledby="sar-flow-title sar-flow-desc">
  <title id="sar-flow-title">LLaMAR SAR 多智能体运行流程</title>
  <desc id="sar-flow-desc">实验准备完成后，Coordinator 规划并通过 A2A 派发任务给 Worker。Worker 使用 SAR 工具提交动作到 SARBarrier，环境执行后把观测、指标和回调状态汇入反馈与状态卡。达到终止条件时进入清理；否则垂直回到 Coordinator 开始下一轮。</desc>
  <defs>
    <filter id="sar-shadow" x="-12%" y="-12%" width="124%" height="132%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.09"/>
    </filter>
    <marker id="sar-blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#2563eb"/></marker>
    <marker id="sar-orange-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#d97706"/></marker>
    <marker id="sar-green-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#059669"/></marker>
    <marker id="sar-purple-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#7c3aed"/></marker>
    <marker id="sar-red-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#e11d48"/></marker>
    <style>
      .title { fill:#0f172a; font:700 30px 'Inter','PingFang SC','Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif; }
      .subtitle { fill:#334155; font:400 16px 'Inter','PingFang SC','Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif; }
      .legend { fill:#475569; font:500 14px 'Inter','PingFang SC','Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif; }
      .section { fill:#1e3a8a; font:700 18px 'Inter','PingFang SC','Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif; }
      .section-note { fill:#64748b; font:400 14px 'Inter','PingFang SC','Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif; }
      .card-title { fill:#0f172a; font:700 17px 'Inter','PingFang SC','Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif; }
      .card-body { fill:#334155; font:400 15px 'Inter','PingFang SC','Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif; }
      .card-meta { fill:#475569; font:400 13px 'Inter','PingFang SC','Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif; }
      .inverse-title { fill:#ffffff; font:700 17px 'Inter','PingFang SC','Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif; }
      .inverse-body { fill:#dbeafe; font:400 14px 'Inter','PingFang SC','Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif; }
      .edge-label { fill:#334155; font:600 14px 'Inter','PingFang SC','Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif; paint-order:stroke; stroke:#ffffff; stroke-width:5px; stroke-linejoin:round; }
      .caption { fill:#475569; font:400 14px 'Inter','PingFang SC','Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif; }
      .blue { fill:none; stroke:#2563eb; stroke-width:3.2; stroke-linecap:round; marker-end:url(#sar-blue-arrow); }
      .orange { fill:none; stroke:#d97706; stroke-width:3.2; stroke-linecap:round; marker-end:url(#sar-orange-arrow); }
      .green { fill:none; stroke:#059669; stroke-width:3.2; stroke-linecap:round; marker-end:url(#sar-green-arrow); }
      .purple { fill:none; stroke:#7c3aed; stroke-width:3.2; stroke-linecap:round; marker-end:url(#sar-purple-arrow); }
      .loop { fill:none; stroke:#2563eb; stroke-width:3; stroke-dasharray:9 7; stroke-linecap:round; marker-end:url(#sar-blue-arrow); }
      .red { fill:none; stroke:#e11d48; stroke-width:3.2; stroke-linecap:round; marker-end:url(#sar-red-arrow); }
    </style>
  </defs>

  <rect width="1500" height="1100" fill="#f8fafc"/>
  <rect x="28" y="24" width="1444" height="1052" rx="24" fill="#ffffff" stroke="#dbe4ef" stroke-width="2"/>

  <text x="750" y="68" text-anchor="middle" class="title">LLaMAR SAR 多智能体运行流程</text>
  <text x="750" y="96" text-anchor="middle" class="subtitle">单轮只走一条主线；环境结果先汇入反馈与状态，再决定继续或结束</text>

  <g aria-label="图例">
    <line x1="210" y1="133" x2="258" y2="133" class="blue"/><text x="272" y="138" class="legend">协调 / 动作</text>
    <line x1="485" y1="133" x2="533" y2="133" class="orange"/><text x="547" y="138" class="legend">A2A 任务</text>
    <line x1="760" y1="133" x2="808" y2="133" class="green"/><text x="822" y="138" class="legend">环境反馈</text>
    <line x1="1035" y1="133" x2="1083" y2="133" class="purple"/><text x="1097" y="138" class="legend">状态判断</text>
  </g>

  <g aria-label="实验准备">
    <rect x="70" y="170" width="1360" height="130" rx="20" fill="#f8fbff" stroke="#bfdbfe" stroke-width="2"/>
    <rect x="94" y="189" width="132" height="30" rx="15" fill="#dbeafe"/>
    <text x="113" y="210" class="section">实验准备</text>
    <text x="246" y="210" class="section-note">准备完成后，从中间直线进入一轮 Agentic 主循环</text>

    <rect x="100" y="230" width="270" height="48" rx="10" fill="#1d4ed8" filter="url(#sar-shadow)"/>
    <text x="120" y="251" class="inverse-title">实验入口</text>
    <text x="120" y="270" class="inverse-body">experiment.py · scene / agents / seed</text>

    <rect x="415" y="230" width="270" height="48" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5" filter="url(#sar-shadow)"/>
    <text x="435" y="251" class="card-title">运行时初始化</text>
    <text x="435" y="270" class="card-meta">SARBarrier · SAREnv · ExperimentLogger</text>

    <rect x="730" y="230" width="270" height="48" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5" filter="url(#sar-shadow)"/>
    <text x="750" y="251" class="card-title">服务启动</text>
    <text x="750" y="270" class="card-meta">Coordinator :8080 / :8081 → Worker :8191+i</text>

    <rect x="1045" y="230" width="330" height="48" rx="10" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.5" filter="url(#sar-shadow)"/>
    <text x="1065" y="251" class="card-title">运行时状态就绪</text>
    <text x="1065" y="270" class="card-meta">SemanticMap · Supervision · StateProvider</text>
  </g>
  <text x="770" y="325" class="edge-label">开始一轮编排</text>

  <!-- Main round. All links are straight; no feedback line crosses the control row. -->
  <g aria-label="一轮 Agentic 主循环">
    <rect x="70" y="340" width="1360" height="620" rx="22" fill="#fbfdff" stroke="#93c5fd" stroke-width="2"/>
    <rect x="94" y="364" width="232" height="34" rx="17" fill="#dbeafe"/>
    <text x="114" y="387" class="section">一轮 Agentic 主循环</text>
    <text x="350" y="387" class="section-note">主链从左到右；回传统一落到下方反馈与状态卡</text>
  </g>

  <!-- Control row -->
  <g aria-label="Coordinator">
    <rect x="100" y="440" width="210" height="145" rx="14" fill="#ffffff" stroke="#60a5fa" stroke-width="2" filter="url(#sar-shadow)"/>
    <rect x="120" y="458" width="82" height="22" rx="11" fill="#dbeafe"/>
    <text x="161" y="474" text-anchor="middle" class="card-meta">Coordinator</text>
    <text x="120" y="515" class="card-title">Coordinator LLM</text>
    <text x="120" y="541" class="card-body">RouterAgent.run()</text>
    <text x="120" y="564" class="card-meta">pre_llm → Context Memory</text>
  </g>

  <g aria-label="计划与派发">
    <rect x="355" y="440" width="220" height="145" rx="14" fill="#ffffff" stroke="#60a5fa" stroke-width="2" filter="url(#sar-shadow)"/>
    <rect x="375" y="458" width="74" height="22" rx="11" fill="#dbeafe"/>
    <text x="412" y="474" text-anchor="middle" class="card-meta">Plan</text>
    <text x="375" y="515" class="card-title">计划与派发</text>
    <text x="375" y="541" class="card-body">UpdatePlanTool</text>
    <text x="375" y="564" class="card-meta">SendMessageTool · assign / activate / cancel</text>
  </g>

  <g aria-label="A2A 任务传输">
    <rect x="620" y="440" width="170" height="145" rx="14" fill="#fff7ed" stroke="#fb923c" stroke-width="2" filter="url(#sar-shadow)"/>
    <rect x="640" y="458" width="58" height="22" rx="11" fill="#ffedd5"/>
    <text x="669" y="474" text-anchor="middle" class="card-meta">A2A</text>
    <text x="640" y="515" class="card-title">A2A HTTP</text>
    <text x="640" y="541" class="card-body">JSON-RPC task</text>
    <text x="640" y="564" class="card-meta">push callback 回程</text>
  </g>

  <g aria-label="Worker Agent 与工具">
    <rect x="835" y="440" width="240" height="145" rx="14" fill="#ffffff" stroke="#4ade80" stroke-width="2" filter="url(#sar-shadow)"/>
    <rect x="855" y="458" width="70" height="22" rx="11" fill="#dcfce7"/>
    <text x="890" y="474" text-anchor="middle" class="card-meta">Worker</text>
    <text x="855" y="515" class="card-title">WorkerAgent + SAR 工具</text>
    <text x="855" y="541" class="card-body">LLM 选工具 → tool.execute()</text>
    <text x="855" y="564" class="card-meta">Navigate / Explore / UseSupply / Carry …</text>
  </g>

  <g aria-label="SARBarrier">
    <rect x="1120" y="440" width="280" height="145" rx="14" fill="#ffffff" stroke="#22d3ee" stroke-width="2" filter="url(#sar-shadow)"/>
    <rect x="1140" y="458" width="76" height="22" rx="11" fill="#cffafe"/>
    <text x="1178" y="474" text-anchor="middle" class="card-meta">Barrier</text>
    <text x="1140" y="515" class="card-title">SARBarrier</text>
    <text x="1140" y="541" class="card-body">收集 N 个 action</text>
    <text x="1140" y="564" class="card-meta">全员到达 / 60s 超时 → execute_step</text>
  </g>

  <!-- Result row -->
  <g aria-label="环境推进">
    <rect x="1120" y="670" width="280" height="110" rx="14" fill="#ecfeff" stroke="#22d3ee" stroke-width="2" filter="url(#sar-shadow)"/>
    <text x="1142" y="706" class="card-title">SAREnv.step(actions)</text>
    <text x="1142" y="733" class="card-body">原子推进环境、对象和指标</text>
    <text x="1142" y="757" class="card-meta">observation · coverage · transport_rate · finished</text>
  </g>

  <g aria-label="反馈与状态">
    <rect x="360" y="670" width="670" height="110" rx="14" fill="#f0fdf4" stroke="#34d399" stroke-width="2" filter="url(#sar-shadow)"/>
    <text x="384" y="706" class="card-title">反馈与状态</text>
    <text x="384" y="733" class="card-body">Worker：observation / tool result 回填，进入下一次 ReAct</text>
    <text x="384" y="757" class="card-meta">Coordinator：push callback → StateProvider / SemanticMap / EventStore / Logger</text>
  </g>

  <g aria-label="终止判断">
    <polygon points="230,655 330,725 230,795 130,725" fill="#fff7ed" stroke="#f97316" stroke-width="2.2" filter="url(#sar-shadow)"/>
    <text x="230" y="719" text-anchor="middle" class="card-title">达到终止条件？</text>
    <text x="230" y="742" text-anchor="middle" class="card-meta">完成 / 预算耗尽 / 致命错误</text>
  </g>

  <g aria-label="结束与清理">
    <rect x="100" y="835" width="260" height="90" rx="14" fill="#fff1f2" stroke="#fb7185" stroke-width="2" filter="url(#sar-shadow)"/>
    <text x="122" y="868" class="card-title">结束与清理</text>
    <text x="122" y="893" class="card-body">barrier.stop → workers.stop</text>
    <text x="122" y="913" class="card-meta">coordinator.stop → logger.close</text>
  </g>
  <rect x="160" y="955" width="140" height="34" rx="17" fill="#fff1f2" stroke="#fb7185" stroke-width="1.8"/>
  <text x="230" y="978" text-anchor="middle" class="card-title">流程结束</text>

  <!-- Lines are drawn last and occupy only the gaps between cards. -->
  <path d="M370 250 H415" class="blue"/>
  <path d="M685 250 H730" class="blue"/>
  <path d="M1000 250 H1045" class="blue"/>
  <path d="M750 300 V340" class="blue"/>
  <path d="M310 510 H355" class="blue"/>
  <path d="M575 510 H620" class="orange"/>
  <path d="M790 510 H835" class="orange"/>
  <path d="M1075 510 H1120" class="blue"/>
  <path d="M1260 585 V670" class="blue"/>
  <path d="M1120 725 H1030" class="green"/>
  <path d="M360 725 H330" class="purple"/>
  <path d="M230 655 V585" class="loop"/>
  <path d="M230 795 V835" class="red"/>
  <path d="M230 925 V955" class="red"/>

  <text x="322" y="492" text-anchor="middle" class="edge-label">规划</text>
  <text x="598" y="492" text-anchor="middle" class="edge-label">派发</text>
  <text x="812" y="492" text-anchor="middle" class="edge-label">任务</text>
  <text x="1097" y="492" text-anchor="middle" class="edge-label">actions</text>
  <text x="1104" y="708" text-anchor="middle" class="edge-label">结果</text>
  <text x="345" y="708" text-anchor="middle" class="edge-label">状态</text>
  <text x="248" y="632" class="edge-label">否：继续</text>
  <text x="248" y="816" class="edge-label">是：清理</text>

  <text x="750" y="1025" text-anchor="middle" class="caption">读图要点：绿色反馈卡统一承接 Worker 观测与 Coordinator 回调；“否”只通过一条垂直虚线回到 Coordinator，不再绕图。</text>
</svg>
