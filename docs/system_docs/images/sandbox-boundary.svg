<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="100%" height="auto" viewBox="0 0 1500 1045"
     preserveAspectRatio="xMidYMin meet"
     role="img" aria-labelledby="diagram-title diagram-desc"
     style="display:block;width:100%;height:auto;max-width:1500px">
  <title id="diagram-title">Sandbox 策略与工具边界</title>
  <desc id="diagram-desc">从 --sandbox-profile 到 SandboxPolicy、工具包装器与逐工具执行结果的源码可追溯流程图。SAR workspace 模式的 effective write root 是 ExperimentLogger result directory；workspace 是 read root，未显式保留为 write root。off 模式绕过全部沙箱检查并直接执行原始 Tool.execute；workspace 通过 SandboxedTool.execute。rejection 聚合为 failed ToolResult，再回到 Agent ReAct。</desc>

  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e4572e"/>
    </marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 32px "Noto Sans CJK SC", "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #17263d; }
      .subtitle { font: 400 16px "Noto Sans CJK SC", "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #5b6b82; }
      .card-title { font: 700 19px "Noto Sans CJK SC", "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #17263d; }
      .body { font: 400 17px "Noto Sans CJK SC", "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #30435c; }
      .body-strong { font: 600 17px "Noto Sans CJK SC", "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #17263d; }
      .small { font: 400 15px "Noto Sans CJK SC", "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #5b6b82; }
      .tiny { font: 400 14px "Noto Sans CJK SC", "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #64748b; }
      .code { font: 600 18px "JetBrains Mono", "Cascadia Code", "Noto Sans Mono", Consolas, monospace; fill: #1e3a8a; }
      .code-dark { font: 600 17px "JetBrains Mono", "Cascadia Code", "Noto Sans Mono", Consolas, monospace; fill: #17263d; }
      .code-small { font: 600 15px "JetBrains Mono", "Cascadia Code", "Noto Sans Mono", Consolas, monospace; fill: #334155; }
      .lane-code { font: 700 16px "JetBrains Mono", "Cascadia Code", "Noto Sans Mono", Consolas, monospace; fill: #17263d; }
      .label { font: 700 14px "Noto Sans CJK SC", "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #475569; letter-spacing: .3px; }
      .label-blue { font: 700 14px "Noto Sans CJK SC", "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #2563eb; letter-spacing: .2px; }
      .label-green { font: 700 14px "Noto Sans CJK SC", "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #15803d; letter-spacing: .2px; }
      .label-red { font: 700 14px "Noto Sans CJK SC", "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #c2410c; letter-spacing: .2px; }
      .label-gray { font: 700 14px "Noto Sans CJK SC", "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #475569; letter-spacing: .2px; }
      .connector-blue { fill: none; stroke: #2563eb; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-blue); }
      .connector-green { fill: none; stroke: #16a34a; stroke-width: 2.1; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-green); }
      .connector-red { fill: none; stroke: #e4572e; stroke-width: 2.1; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-red); }
      .connector-gray { fill: none; stroke: #64748b; stroke-width: 2.1; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-gray); }
      .connector-bus { fill: none; stroke: #e4572e; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
      .card-blue { fill: #eff6ff; stroke: #60a5fa; stroke-width: 1.7; }
      .card-off { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.7; }
      .card-green { fill: #f0fdf4; stroke: #86efac; stroke-width: 1.5; }
      .card-red { fill: #fff1ed; stroke: #fb8b6a; stroke-width: 1.5; }
      .card-gray { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 1.5; }
      .card-delegate { fill: #f8fafc; stroke: #64748b; stroke-width: 1.5; stroke-dasharray: 5 3; }
      .pill-blue { fill: #dbeafe; stroke: #93c5fd; stroke-width: 1; }
      .pill-green { fill: #dcfce7; stroke: #86efac; stroke-width: 1; }
      .rule { stroke: #e2e8f0; stroke-width: 1; }
      .port { fill: #2563eb; stroke: #ffffff; stroke-width: 2; }
    </style>
  </defs>

  <!-- Canvas -->
  <rect x="0" y="0" width="1500" height="1045" fill="#ffffff"/>

  <!-- Header -->
  <text class="title" x="50" y="46">沙箱策略与工具边界</text>
  <text class="subtitle" x="52" y="73">源码可追溯 · 蓝色为 policy 主链，结果边界按 allowed / rejection / pass-through 分色</text>
  <line class="rule" x1="50" y1="87" x2="1450" y2="87"/>

  <!-- Profile selector -->
  <rect class="card-blue" x="490" y="100" width="520" height="75" rx="13"/>
  <text class="label-blue" x="515" y="123">ENTRY / PROFILE SELECTOR</text>
  <text class="code" x="515" y="151">--sandbox-profile</text>
  <text class="small" x="745" y="123">Coordinator CLI · Worker CLI · SAR <tspan class="code-small">run_experiment()</tspan></text>
  <rect class="pill-blue" x="745" y="135" width="108" height="23" rx="11.5"/>
  <text class="tiny" x="799" y="151" text-anchor="middle">CLI default: off</text>
  <rect class="pill-green" x="863" y="135" width="145" height="23" rx="11.5"/>
  <text class="tiny" x="935.5" y="151" text-anchor="middle">SAR default: workspace</text>

  <!-- Profile branches -->
  <rect class="card-off" x="70" y="205" width="420" height="130" rx="13"/>
  <rect x="70" y="205" width="8" height="130" rx="4" fill="#64748b"/>
  <text class="label-gray" x="98" y="231">PROFILE = OFF</text>
  <text class="code-dark" x="98" y="261">SandboxPolicy.off()</text>
  <text class="body-strong" x="98" y="287">_enabled = False</text>
  <text class="body" x="98" y="311">no path restriction · Bash pass-through</text>
  <text class="small" x="98" y="330">wrap_tools_with_sandbox() → original tool list</text>
  <text class="label-gray" x="280" y="194" text-anchor="middle">off</text>

  <rect class="card-blue" x="560" y="205" width="870" height="130" rx="13"/>
  <rect x="560" y="205" width="8" height="130" rx="4" fill="#2563eb"/>
  <text class="label-blue" x="590" y="231">PROFILE = WORKSPACE</text>
  <text class="code" x="590" y="261">SandboxPolicy.workspace(...)</text>
  <text class="body-strong" x="590" y="287">path-restricted · paths resolve relative to workspace</text>
  <text class="small" x="590" y="311">SAR / CLI current call: <tspan class="code-small">bash_enabled=False</tspan> (interface remains configurable)</text>
  <text class="small" x="590" y="330">SAR default; CLI can select off or workspace</text>
  <text class="label-blue" x="995" y="194" text-anchor="middle">workspace</text>

  <!-- Branch-specific next stages -->
  <rect class="card-off" x="70" y="360" width="420" height="100" rx="13"/>
  <text class="label-gray" x="98" y="385">OFF / DIRECT EXECUTION</text>
  <text class="body-strong" x="98" y="414">bypass all sandbox checks</text>
  <text class="code-dark" x="98" y="440">→ original Tool.execute</text>
  <text class="small" x="98" y="456">policy disabled · wrapper bypassed</text>

  <rect class="card-blue" x="560" y="360" width="870" height="100" rx="13"/>
  <text class="label-blue" x="590" y="384">POLICY FIELDS / ALLOWLISTS</text>
  <rect class="pill-blue" x="590" y="395" width="145" height="26" rx="13"/>
  <text class="code-small" x="662.5" y="413" text-anchor="middle">workspace_dir</text>
  <rect class="pill-blue" x="747" y="395" width="114" height="26" rx="13"/>
  <text class="code-small" x="804" y="413" text-anchor="middle">read_roots</text>
  <rect class="pill-blue" x="873" y="395" width="122" height="26" rx="13"/>
  <text class="code-small" x="934" y="413" text-anchor="middle">write_roots</text>
  <rect class="pill-blue" x="1007" y="395" width="184" height="26" rx="13"/>
  <text class="code-small" x="1099" y="413" text-anchor="middle">tool_import_roots</text>
  <text class="small" x="1215" y="413">relative anchor → workspace</text>
  <text class="small" x="590" y="442">effective SAR write root: <tspan class="code-small">ExperimentLogger</tspan> result directory</text>
  <text class="small" x="590" y="456">workspace is a read root; not explicitly retained as a write root</text>

  <!-- Workspace wrapper / execution interceptor -->
  <rect class="card-blue" x="560" y="480" width="870" height="85" rx="13"/>
  <text class="label-blue" x="590" y="505">WRAPPER / EXECUTION INTERCEPTOR</text>
  <text class="code" x="590" y="532">wrap_tools_with_sandbox(tools, policy)</text>
  <text class="code-dark" x="1010" y="532">workspace → SandboxedTool.execute</text>
  <text class="small" x="590" y="554">file + Bash names intercepted</text>
  <text class="small" x="1010" y="554">unknown/domain → delegate unchanged</text>

  <!-- Tool swimlane -->
  <rect x="40" y="590" width="1420" height="300" rx="17" fill="#fbfdff" stroke="#cbd5e1" stroke-width="1.7"/>
  <rect x="40" y="590" width="1420" height="50" rx="17" fill="#f8fafc"/>
  <line class="rule" x1="40" y1="640" x2="1460" y2="640"/>
  <text class="card-title" x="70" y="622">TOOL SWIMLANE</text>
  <rect id="entry-off" class="card-off" x="250" y="598" width="355" height="35" rx="8" data-entry="off → original Tool.execute"/>
  <text class="label-gray" x="267" y="612">OFF ENTRY / DIRECT</text>
  <text class="code-small" x="267" y="630">bypass checks → original Tool.execute</text>
  <rect id="entry-workspace" class="card-blue" x="1030" y="598" width="355" height="35" rx="8" data-entry="workspace → SandboxedTool.execute"/>
  <text class="label-blue" x="1047" y="612">WORKSPACE ENTRY / WRAPPED</text>
  <text class="code-small" x="1047" y="630">SandboxedTool.execute</text>

  <!-- Lane column headings -->
  <text class="label-gray" x="70" y="663">TOOL CALL</text>
  <text class="label-gray" x="330" y="663">POLICY CHECK</text>
  <text class="label-gray" x="565" y="663">DECISION</text>
  <text class="label-gray" x="805" y="663">OUTCOME / NEXT RESULT</text>

  <!-- Row 1: read -->
  <rect id="read-tool" class="card" x="70" y="680" width="240" height="43" rx="8" data-source="sandbox.py:128,179-189"/>
  <text class="lane-code" x="88" y="704">read_file</text>
  <text class="tiny" x="88" y="720">path input</text>
  <rect class="card-blue" x="330" y="680" width="210" height="43" rx="8"/>
  <text class="code-small" x="348" y="704">check_read(path)</text>
  <text class="tiny" x="348" y="720">Path.resolve()</text>
  <rect class="card-blue" x="565" y="680" width="220" height="43" rx="8"/>
  <text class="body-strong" x="675" y="704" text-anchor="middle">within read_roots?</text>
  <text class="tiny" x="675" y="720" text-anchor="middle">allowed / violation</text>
  <rect class="card-green" x="805" y="683" width="250" height="20" rx="7"/>
  <text class="label-green" x="817" y="697">ALLOWED</text>
  <text class="small" x="904" y="697">resolved path in read_roots</text>
  <rect id="read-rejection" class="card-red" x="805" y="706" width="615" height="20" rx="7"/>
  <text class="label-red" x="817" y="719">VIOLATION</text>
  <text class="small" x="915" y="719"><tspan class="code-small">SandboxViolation</tspan> · path escapes read_roots</text>

  <!-- Row 2: write/edit -->
  <rect id="write-tool" class="card" x="70" y="733" width="240" height="43" rx="8" data-source="sandbox.py:128,179-189"/>
  <text class="lane-code" x="88" y="757">write_file / edit_file</text>
  <text class="tiny" x="88" y="773">path + content</text>
  <rect class="card-blue" x="330" y="733" width="210" height="43" rx="8"/>
  <text class="code-small" x="348" y="757">check_write(path)</text>
  <text class="tiny" x="348" y="773">Path.resolve()</text>
  <rect class="card-blue" x="565" y="733" width="220" height="43" rx="8"/>
  <text class="body-strong" x="675" y="757" text-anchor="middle">within write_roots?</text>
  <text class="tiny" x="675" y="773" text-anchor="middle">allowed / violation</text>
  <rect class="card-green" x="805" y="736" width="250" height="20" rx="7"/>
  <text class="label-green" x="817" y="750">ALLOWED</text>
  <text class="small" x="904" y="750">resolved path in write_roots</text>
  <rect id="write-rejection" class="card-red" x="805" y="759" width="615" height="20" rx="7"/>
  <text class="label-red" x="817" y="772">VIOLATION</text>
  <text class="small" x="915" y="772"><tspan class="code-small">SandboxViolation</tspan> · path escapes write_roots</text>

  <!-- Row 3: Bash -->
  <rect id="bash-tool" class="card" x="70" y="786" width="240" height="43" rx="8" data-source="sandbox.py:129,170-177"/>
  <text class="lane-code" x="88" y="804">bash / bash_output</text>
  <text class="lane-code" x="88" y="821">bash_kill</text>
  <rect class="card-blue" x="330" y="786" width="210" height="43" rx="8"/>
  <text class="code-small" x="348" y="804">_bash_enabled</text>
  <text class="tiny" x="348" y="821">policy flag</text>
  <rect class="card-blue" x="565" y="786" width="220" height="43" rx="8"/>
  <text class="body-strong" x="675" y="804" text-anchor="middle">bash_enabled == False?</text>
  <text class="tiny" x="675" y="821" text-anchor="middle">interface can set True</text>
  <rect class="card-gray" x="805" y="789" width="380" height="20" rx="7"/>
  <text class="label-gray" x="817" y="803">TRUE / INTERFACE OPTION</text>
  <text class="small" x="1015" y="803">delegate to BashTool</text>
  <rect id="bash-rejection" class="card-red" x="805" y="812" width="615" height="20" rx="7"/>
  <text class="label-red" x="817" y="825">FALSE / BASH DISABLED</text>
  <text class="small" x="1080" y="825"><tspan class="code-small">ToolResult(success=False)</tspan> · Bash disabled</text>

  <!-- Row 4: domain tools; workspace delegation, not the off bypass -->
  <rect class="card-delegate" x="70" y="839" width="240" height="43" rx="8" data-source="sandbox.py:132-139,191"/>
  <text class="lane-code" x="88" y="857">SAR / MCP / unknown</text>
  <text class="tiny" x="88" y="875">domain tools</text>
  <rect class="card-delegate" x="330" y="839" width="210" height="43" rx="8"/>
  <text class="code-small" x="348" y="857">not in intercept sets</text>
  <text class="tiny" x="348" y="875">file / Bash tools only</text>
  <rect class="card-delegate" x="565" y="839" width="220" height="43" rx="8"/>
  <text class="body-strong" x="675" y="857" text-anchor="middle">workspace delegate?</text>
  <text class="tiny" x="675" y="875" text-anchor="middle">unknown name → unchanged</text>
  <rect class="card-delegate" x="805" y="849" width="615" height="24" rx="8"/>
  <text class="label-gray" x="817" y="866">WORKSPACE DELEGATE</text>
  <text class="small" x="1015" y="866">unknown/domain tool → delegate unchanged</text>

  <!-- Shared rejection bus stays in the gap, never through Agent ReAct. -->
  <path id="rejection-bus" class="connector-bus" d="M 795 716 L 795 937"/>

  <!-- Rejection aggregation → failed result → Agent ReAct -->
  <rect id="rejection-aggregator" class="card-red" x="805" y="910" width="300" height="54" rx="11" data-source="sandbox.py:170-188"/>
  <text class="label-red" x="825" y="933">REJECTION AGGREGATOR</text>
  <text class="small" x="825" y="953">file violation or Bash disabled</text>
  <rect id="failed-tool-result" class="card-red" x="1125" y="910" width="335" height="54" rx="11" data-source="sandbox.py:119-125; agent.py:706-764,723-800"/>
  <text class="label-red" x="1145" y="933">FAILED TOOL RESULT</text>
  <text class="code-small" x="1145" y="953">ToolResult(success=False)</text>
  <rect id="agent-react-card" class="card-blue" x="1125" y="980" width="335" height="55" rx="11" data-source="router_agent/agent.py:706-764; worker_agent/agent.py:723-800"/>
  <text class="label-blue" x="1145" y="1003">AGENT LOOP / NEXT DECISION</text>
  <text class="body-strong" x="1145" y="1025">failed ToolResult → Agent ReAct</text>

  <!-- Connectors are rendered after cards so arrowheads land on exposed edges. -->
  <path id="profile-to-off" class="connector-blue" d="M 650 175 L 280 205"/>
  <path id="profile-to-workspace" class="connector-blue" d="M 850 175 L 995 205"/>
  <path class="connector-gray" d="M 280 335 L 280 360"/>
  <path class="connector-blue" d="M 995 335 L 995 360"/>
  <path id="off-to-direct-entry" class="connector-gray" d="M 280 460 L 280 598"/>

  <!-- Short workspace edge-to-edge segments: policy input and wrapper output. -->
  <path id="workspace-to-wrapper-input" class="connector-blue" d="M 1180 460 L 1180 478.5"/>
  <path id="workspace-to-wrapped-entry" class="connector-blue" d="M 1220 566.5 L 1220 598"/>
  <circle class="port" cx="1180" cy="480" r="4" aria-label="wrapper input port"/>
  <circle class="port" cx="1220" cy="565" r="4" aria-label="wrapper output port"/>

  <!-- Per-tool checks -->
  <path class="connector-blue" d="M 310 701 L 330 701"/>
  <path class="connector-blue" d="M 540 701 L 565 701"/>
  <path class="connector-green" d="M 785 701 L 805 693"/>
  <path id="read-rejection-edge" class="connector-red" d="M 785 701 L 795 701 L 795 716 L 805 716"/>

  <path class="connector-blue" d="M 310 754 L 330 754"/>
  <path class="connector-blue" d="M 540 754 L 565 754"/>
  <path class="connector-green" d="M 785 754 L 805 746"/>
  <path id="write-rejection-edge" class="connector-red" d="M 785 754 L 795 754 L 795 769 L 805 769"/>

  <path class="connector-blue" d="M 310 807 L 330 807"/>
  <path class="connector-blue" d="M 540 807 L 565 807"/>
  <path class="connector-gray" d="M 785 807 L 805 799"/>
  <path id="bash-rejection-edge" class="connector-red" d="M 785 807 L 795 807 L 795 822 L 805 822"/>

  <path class="connector-gray" d="M 310 860 L 330 860"/>
  <path class="connector-gray" d="M 540 860 L 565 860"/>
  <path class="connector-gray" d="M 785 860 L 805 861"/>

  <path id="rejection-to-aggregator" class="connector-red" d="M 795 937 L 805 937"/>
  <path id="aggregator-to-failed-result" class="connector-red" d="M 1105 937 L 1125 937"/>
  <path id="failed-result-to-react" class="connector-red" d="M 1292 964 L 1292 978.5"/>
</svg>
