<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1330" role="img" aria-labelledby="rt-title rt-desc">
  <title id="rt-title">Agentic 路由策略：决策 → 激活 → 派发 → 监督回流（2026-08）</title>
  <desc id="rt-desc">对齐 main 22c5f4e 代码重绘。A 逻辑计划层：编排 LLM（RouterAgent 本体）经 UpdatePlanTool 声明 MissionGraph 逻辑 DAG，frontier 只产出 ready/blocked，不直接激活。B 激活脊柱现为 4+1 相位：DAG gate → 新增 Phase 1.5 team 协议 fail-fast → atomic claim → Team ACK saga → awaited fan-out，fan-out 全成功后自动 ACCEPTED→RUNNING。C 物理派发状态带：PhysicalState 九态转移矩阵。D 状态回流与监督：TaskStore.apply_physical_status 唯一 canonical 入口 → mark_dispatch_terminal → frontier 重算回注；7 月引入 · 8 月强化（stale baseline 修复）监督环，告警经 context projection 成为第二条决策反馈通道；abort 独立终止。</desc>
  <defs>
    <filter id="rt-shadow" x="-12%" y="-12%" width="124%" height="132%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.09"/>
    </filter>
    <marker id="rt-arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#2563eb"/></marker>
    <marker id="rt-arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#d97706"/></marker>
    <marker id="rt-arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#059669"/></marker>
    <marker id="rt-arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#7c3aed"/></marker>
    <marker id="rt-arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#dc2626"/></marker>
