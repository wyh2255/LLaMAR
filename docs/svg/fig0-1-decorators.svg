<svg xmlns="http://www.w3.org/2000/svg" width="800" height="620" viewBox="0 0 800 620">
  <defs>
    <marker id="arrowRight" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrowDown" markerWidth="7" markerHeight="10" refX="3.5" refY="9" orient="auto">
      <polygon points="0 0, 7 0, 3.5 10" fill="#2563eb"/>
    </marker>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="620" fill="#ffffff"/>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#1a2332">SAR 装饰器叠加顺序</text>

  <!-- Decorator layer 1: @collidable (bottom of stack, first to execute) -->
  <g filter="url(#shadow)">
    <rect x="40" y="70" width="300" height="56" rx="10" ry="10" fill="#f4f6f9" stroke="#2563eb" stroke-width="1.5"/>
    <text x="60" y="96" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2563eb">@collidable(is_collidable=False)</text>
    <text x="60" y="114" font-family="sans-serif" font-size="11" fill="#5a6a7e">第 1 层（最外层，__init__ 最先执行）</text>
  </g>
  <line x1="340" y1="98" x2="420" y2="98" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowRight)"/>
  <g filter="url(#shadow)">
    <rect x="430" y="75" width="340" height="46" rx="8" ry="8" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
    <text x="448" y="95" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1a2332">添加 .is_collidable</text>
    <text x="448" y="112" font-family="sans-serif" font-size="11" fill="#5a6a7e">控制导航阻挡（是否可穿越）</text>
  </g>

  <!-- Decorator layer 2: @with_id -->
  <g filter="url(#shadow)">
    <rect x="40" y="150" width="300" height="56" rx="10" ry="10" fill="#f4f6f9" stroke="#2563eb" stroke-width="1.5"/>
    <text x="60" y="176" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2563eb">@with_id</text>
    <text x="60" y="194" font-family="sans-serif" font-size="11" fill="#5a6a7e">第 2 层</text>
  </g>
  <line x1="340" y1="178" x2="420" y2="178" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowRight)"/>
  <g filter="url(#shadow)">
    <rect x="430" y="155" width="340" height="46" rx="8" ry="8" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
    <text x="448" y="175" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1a2332">添加 .id / .class_name()</text>
    <text x="448" y="192" font-family="sans-serif" font-size="11" fill="#5a6a7e">UUID 格式唯一标识符</text>
  </g>

  <!-- Decorator layer 3: @with_position -->
  <g filter="url(#shadow)">
    <rect x="40" y="230" width="300" height="56" rx="10" ry="10" fill="#f4f6f9" stroke="#2563eb" stroke-width="1.5"/>
    <text x="60" y="256" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2563eb">@with_position(mutable=False)</text>
    <text x="60" y="274" font-family="sans-serif" font-size="11" fill="#5a6a7e">第 3 层</text>
  </g>
  <line x1="340" y1="258" x2="420" y2="258" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowRight)"/>
  <g filter="url(#shadow)">
    <rect x="430" y="230" width="340" height="56" rx="8" ry="8" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
    <text x="448" y="252" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1a2332">添加 .position / .get_position() / .sees()</text>
    <text x="448" y="272" font-family="sans-serif" font-size="11" fill="#5a6a7e">位置、可视半径等 10 个方法</text>
  </g>

  <!-- Decorator layer 4: @named -->
  <g filter="url(#shadow)">
    <rect x="40" y="310" width="300" height="56" rx="10" ry="10" fill="#f4f6f9" stroke="#2563eb" stroke-width="1.5"/>
    <text x="60" y="336" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2563eb">@named</text>
    <text x="60" y="354" font-family="sans-serif" font-size="11" fill="#5a6a7e">第 4 层（最内层，__init__ 最后执行）</text>
  </g>
  <line x1="340" y1="338" x2="420" y2="338" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowRight)"/>
  <g filter="url(#shadow)">
    <rect x="430" y="315" width="340" height="46" rx="8" ry="8" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
    <text x="448" y="335" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1a2332">添加 .name / .set_name() / .get_name()</text>
    <text x="448" y="352" font-family="sans-serif" font-size="11" fill="#5a6a7e">人类可读名称</text>
  </g>

  <!-- Vertical stacking arrow (left side) -->
  <line x1="24" y1="126" x2="24" y2="150" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowDown)"/>
  <line x1="24" y1="206" x2="24" y2="230" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowDown)"/>
  <line x1="24" y1="286" x2="24" y2="310" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowDown)"/>
  <text x="24" y="66" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#2563eb" font-weight="bold">外层</text>
  <text x="24" y="380" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#2563eb" font-weight="bold">内层</text>

  <!-- Brace / stacking direction label -->
  <text x="24" y="400" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#5a6a7e">堆叠</text>
  <text x="24" y="414" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#5a6a7e">方向</text>

  <!-- Summary box at bottom -->
  <g filter="url(#shadow)">
    <rect x="40" y="430" width="730" height="80" rx="12" ry="12" fill="#f4f6f9" stroke="#2563eb" stroke-width="1.5"/>
    <text x="60" y="456" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1a2332">叠加顺序</text>
    <text x="60" y="478" font-family="sans-serif" font-size="13" fill="#2563eb" font-weight="bold">@collidable</text>
    <text x="172" y="478" font-family="sans-serif" font-size="13" fill="#5a6a7e"> -> </text>
    <text x="200" y="478" font-family="sans-serif" font-size="13" fill="#2563eb" font-weight="bold">@with_id</text>
    <text x="278" y="478" font-family="sans-serif" font-size="13" fill="#5a6a7e"> -> </text>
    <text x="306" y="478" font-family="sans-serif" font-size="13" fill="#2563eb" font-weight="bold">@with_position</text>
    <text x="430" y="478" font-family="sans-serif" font-size="13" fill="#5a6a7e"> -> </text>
    <text x="458" y="478" font-family="sans-serif" font-size="13" fill="#2563eb" font-weight="bold">@named</text>
    <text x="60" y="500" font-family="sans-serif" font-size="12" fill="#5a6a7e">初始化时从外向内调用 __init__（@collidable 的 __init__ 先执行，@named 的 __init__ 最后执行）</text>
  </g>

  <!-- Execution order arrow at bottom -->
  <text x="60" y="545" font-family="sans-serif" font-size="12" fill="#5a6a7e">执行顺序示意：</text>
  <rect x="60" y="555" width="680" height="4" rx="2" fill="#e0e7ff"/>
  <rect x="60" y="555" width="680" height="4" rx="2" fill="none" stroke="#2563eb" stroke-width="0.5" stroke-dasharray="4,2"/>
  <text x="60" y="580" font-family="sans-serif" font-size="11" fill="#2563eb">__init__ 执行方向 -->></text>
  <text x="60" y="598" font-family="sans-serif" font-size="11" fill="#5a6a7e">collidable.__init__()  ->  with_id.__init__()  ->  with_position.__init__()  ->  named.__init__()</text>
</svg>