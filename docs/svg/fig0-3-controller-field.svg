<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520">
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#5a6a7e"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="520" fill="#ffffff"/>

  <!-- Title -->
  <text x="400" y="36" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1a2332">Controller / Field / POI 层次结构</text>

  <!-- ==================== TOP TIER: Controller ==================== -->
  <rect x="280" y="58" width="240" height="72" rx="12" fill="#2563eb" filter="url(#shadow)"/>
  <text x="400" y="90" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#ffffff">Controller</text>
  <text x="400" y="114" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#dbeafe">(控制器 / 入口)</text>

  <!-- Arrow from Controller down (trunk) -->
  <line x1="400" y1="130" x2="400" y2="175" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <rect x="326" y="140" width="148" height="20" rx="4" fill="#ffffff"/>
  <text x="400" y="155" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#2563eb">创建并持有</text>

  <!-- Branch lines -->
  <line x1="400" y1="175" x2="160" y2="175" stroke="#2563eb" stroke-width="2"/>
  <line x1="400" y1="175" x2="640" y2="175" stroke="#2563eb" stroke-width="2"/>
  <line x1="160" y1="175" x2="160" y2="195" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <line x1="400" y1="175" x2="400" y2="195" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <line x1="640" y1="175" x2="640" y2="195" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- ==================== MIDDLE TIER: Field / Backend / Clock ==================== -->
  <!-- Field -->
  <rect x="70" y="195" width="180" height="72" rx="12" fill="#f4f6f9" stroke="#c8cdd5" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="160" y="227" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1a2332">Field</text>
  <text x="160" y="251" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#5a6a7e">(世界状态)</text>

  <!-- Backend -->
  <rect x="310" y="195" width="180" height="72" rx="12" fill="#f4f6f9" stroke="#c8cdd5" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="400" y="227" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1a2332">Backend</text>
  <text x="400" y="251" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#5a6a7e">(引擎层)</text>

  <!-- Clock -->
  <rect x="550" y="195" width="180" height="72" rx="12" fill="#f4f6f9" stroke="#c8cdd5" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="640" y="227" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1a2332">Clock</text>
  <text x="640" y="251" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#5a6a7e">(时钟驱动)</text>

  <!-- ==================== CONNECTIONS: Middle → Bottom ==================== -->
  <!-- Field → GridEngine -->
  <line x1="160" y1="267" x2="160" y2="310" stroke="#5a6a7e" stroke-width="2" marker-end="url(#arrow-gray)"/>
  <rect x="62" y="276" width="100" height="20" rx="4" fill="#ffffff"/>
  <text x="112" y="291" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5a6a7e">持有所有 POI</text>

  <!-- Backend → GridEngine -->
  <line x1="400" y1="267" x2="400" y2="310" stroke="#5a6a7e" stroke-width="2" marker-end="url(#arrow-gray)"/>
  <rect x="332" y="276" width="80" height="20" rx="4" fill="#ffffff"/>
  <text x="372" y="291" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5a6a7e">选择引擎</text>

  <!-- Converging lines to GridEngine center -->
  <line x1="160" y1="310" x2="310" y2="310" stroke="#5a6a7e" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="400" y1="328" x2="400" y2="340" stroke="#16a34a" stroke-width="0"/>

  <!-- ==================== BOTTOM TIER: GridEngine ==================== -->
  <rect x="200" y="340" width="400" height="80" rx="14" fill="#ecfdf5" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
  <text x="400" y="375" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#16a34a">GridEngine</text>
  <text x="400" y="403" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#5a6a7e">(网格移动 + 碰撞检测)</text>

  <!-- ==================== DECORATIVE: POI icons in Field ==================== -->
  <!-- Small POI tags inside Field box -->
  <rect x="82" y="258" width="48" height="16" rx="3" fill="#dbeafe"/>
  <text x="106" y="270" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#2563eb">Fire</text>
  <rect x="134" y="258" width="52" height="16" rx="3" fill="#dbeafe"/>
  <text x="160" y="270" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#2563eb">Agent</text>
  <rect x="190" y="258" width="52" height="16" rx="3" fill="#dbeafe"/>
  <text x="216" y="270" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#2563eb">Person</text>

  <!-- ==================== LEGEND ==================== -->
  <rect x="30" y="450" width="740" height="52" rx="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
  <circle cx="70" cy="476" r="8" fill="#2563eb"/>
  <text x="84" y="481" font-family="sans-serif" font-size="12" fill="#1a2332">入口层 (Controller)</text>
  <circle cx="250" cy="476" r="8" fill="#f4f6f9" stroke="#c8cdd5" stroke-width="1.5"/>
  <text x="264" y="481" font-family="sans-serif" font-size="12" fill="#1a2332">中间层 (Field / Backend / Clock)</text>
  <circle cx="500" cy="476" r="8" fill="#16a34a"/>
  <text x="514" y="481" font-family="sans-serif" font-size="12" fill="#1a2332">引擎层 (GridEngine)</text>
</svg>