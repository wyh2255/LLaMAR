<svg xmlns="http://www.w3.org/2000/svg" width="800" height="680" viewBox="0 0 800 680">
  <defs>
    <marker id="arrowDash" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <marker id="arrowComp" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#5a6a7e"/>
    </marker>
    <filter id="shadow2" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="680" fill="#ffffff"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#1a2332">游戏对象（POI）分类</text>

  <!-- Outer container -->
  <g filter="url(#shadow2)">
    <rect x="30" y="55" width="740" height="600" rx="16" ry="16" fill="#f4f6f9" stroke="#2563eb" stroke-width="2"/>
  </g>

  <!-- Decorator banner -->
  <rect x="60" y="72" width="680" height="40" rx="8" ry="8" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="400" y="98" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#2563eb" font-weight="bold">@named + @with_id + @with_position + @collidable</text>

  <!-- Row 1 label -->
  <text x="60" y="140" font-family="sans-serif" font-size="12" fill="#5a6a7e" font-weight="bold">第一行</text>

  <!-- Card 1: Flammable -->
  <g filter="url(#shadow2)">
    <rect x="70" y="150" width="210" height="130" rx="12" ry="12" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="175" y="176" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1a2332">Flammable</text>
    <text x="175" y="196" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5a6a7e">单个火格子</text>
    <line x1="90" y1="208" x2="260" y2="208" stroke="#e0e7ff" stroke-width="1"/>
    <text x="175" y="228" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5a6a7e">mutable: <tspan fill="#2563eb" font-weight="bold">False</tspan></text>
    <text x="175" y="248" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5a6a7e">collidable: <tspan fill="#2563eb" font-weight="bold">False</tspan></text>
    <text x="175" y="268" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5a6a7e">intensity: NONE -> LOW -> MED -> HIGH</text>
  </g>

  <!-- Card 2: Fire -->
  <g filter="url(#shadow2)">
    <rect x="295" y="150" width="210" height="130" rx="12" ry="12" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="400" y="176" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1a2332">Fire</text>
    <text x="400" y="196" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5a6a7e">火灾聚合</text>
    <line x1="315" y1="208" x2="485" y2="208" stroke="#e0e7ff" stroke-width="1"/>
    <text x="400" y="228" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5a6a7e">mutable: <tspan fill="#2563eb" font-weight="bold">False</tspan></text>
    <text x="400" y="248" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5a6a7e">collidable: <tspan fill="#2563eb" font-weight="bold">False</tspan></text>
    <text x="400" y="268" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5a6a7e">组合多个 Flammable 对象</text>
  </g>

  <!-- Card 3: Person -->
  <g filter="url(#shadow2)">
    <rect x="520" y="150" width="210" height="130" rx="12" ry="12" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="625" y="176" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1a2332">Person</text>
    <text x="625" y="196" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5a6a7e">被困人员</text>
    <line x1="540" y1="208" x2="710" y2="208" stroke="#e0e7ff" stroke-width="1"/>
    <text x="625" y="228" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5a6a7e">mutable: <tspan fill="#2563eb" font-weight="bold">True</tspan></text>
    <text x="625" y="248" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5a6a7e">collidable: <tspan fill="#2563eb" font-weight="bold">True</tspan></text>
    <text x="625" y="268" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5a6a7e">load >= 2 agents to carry</text>
  </g>

  <!-- Composition arrow: Fire -> Flammable -->
  <path d="M 350 280 L 350 300 Q 350 310 340 310 L 220 310 Q 210 310 210 300 L 210 280" fill="none" stroke="#5a6a7e" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrowComp)"/>
  <text x="280" y="325" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5a6a7e">组合 (contains)</text>

  <!-- Separator -->
  <line x1="60" y1="345" x2="740" y2="345" stroke="#e0e7ff" stroke-width="1" stroke-dasharray="6,3"/>
  <text x="60" y="368" font-family="sans-serif" font-size="12" fill="#5a6a7e" font-weight="bold">第二行</text>

  <!-- Card 4: Reservoir -->
  <g filter="url(#shadow2)">
    <rect x="70" y="380" width="210" height="120" rx="12" ry="12" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="175" y="406" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1a2332">Reservoir</text>
    <text x="175" y="426" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5a6a7e">资源源（沙/水）</text>
    <line x1="90" y1="438" x2="260" y2="438" stroke="#e0e7ff" stroke-width="1"/>
    <text x="175" y="458" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5a6a7e">mutable: <tspan fill="#2563eb" font-weight="bold">False</tspan></text>
    <text x="175" y="478" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5a6a7e">collidable: <tspan fill="#2563eb" font-weight="bold">True</tspan></text>
    <text x="175" y="495" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5a6a7e">无限容量资源来源</text>
  </g>

  <!-- Card 5: Deposit -->
  <g filter="url(#shadow2)">
    <rect x="295" y="380" width="210" height="120" rx="12" ry="12" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="400" y="406" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1a2332">Deposit</text>
    <text x="400" y="426" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5a6a7e">存储点（救援目的地）</text>
    <line x1="315" y1="438" x2="485" y2="438" stroke="#e0e7ff" stroke-width="1"/>
    <text x="400" y="458" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5a6a7e">mutable: <tspan fill="#2563eb" font-weight="bold">False</tspan></text>
    <text x="400" y="478" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5a6a7e">collidable: <tspan fill="#2563eb" font-weight="bold">True</tspan></text>
    <text x="400" y="495" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5a6a7e">资源存储 + 人员交付点</text>
  </g>

  <!-- Card 6: AbsAgent -->
  <g filter="url(#shadow2)">
    <rect x="520" y="380" width="210" height="120" rx="12" ry="12" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="625" y="406" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1a2332">AbsAgent</text>
    <text x="625" y="426" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5a6a7e">智能体（机器人）</text>
    <line x1="540" y1="438" x2="710" y2="438" stroke="#e0e7ff" stroke-width="1"/>
    <text x="625" y="458" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5a6a7e">mutable: <tspan fill="#2563eb" font-weight="bold">True</tspan></text>
    <text x="625" y="478" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5a6a7e">collidable: <tspan fill="#2563eb" font-weight="bold">True</tspan></text>
    <text x="625" y="495" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5a6a7e">inventory capacity = 3</text>
  </g>

  <!-- Legend -->
  <rect x="60" y="525" width="680" height="110" rx="10" ry="10" fill="#ffffff" stroke="#e0e7ff" stroke-width="1"/>
  <text x="80" y="548" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1a2332">属性说明</text>
  <line x1="80" y1="556" x2="720" y2="556" stroke="#e0e7ff" stroke-width="1"/>
  <circle cx="90" cy="575" r="4" fill="#2563eb"/>
  <text x="102" y="580" font-family="sans-serif" font-size="12" fill="#1a2332">mutable = True：位置可变（Person、AbsAgent 可在地图上移动）</text>
  <circle cx="90" cy="598" r="4" fill="#5a6a7e"/>
  <text x="102" y="603" font-family="sans-serif" font-size="12" fill="#1a2332">mutable = False：位置固定（Flammable、Fire、Reservoir、Deposit）</text>
  <circle cx="90" cy="621" r="4" fill="#2563eb"/>
  <text x="102" y="626" font-family="sans-serif" font-size="12" fill="#1a2332">collidable = True：阻挡导航路径（Agent、Person、Reservoir、Deposit）</text>
</svg>